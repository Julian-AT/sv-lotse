# S3 multi-turn GRPO for SV-Lotse-A3B with verl (lotse-rl.md §7.1). Config only, not yet run.
#   uv run python -m rl.train --config rl/grpo-a3b.yaml          # prints + runs the verl command
# Starts from the S2 SFT checkpoint (LoRA merged). GPU layout on 3×H100: GPU 0 serves the policy
# rollouts (vLLM, async server) and the open user simulator; GPUs 1-2 run the FSDP actor update.
# 256 episodes per step = 32 personas × group 8.
base: qwen3-30b-a3b
policy: checkpoints/sft-qwen3-30b-a3b-merged
simulator:
  model: Qwen/Qwen3-32B        # open simulator for training (§5.3); frontier only for eval
  gpu: 0
  gpu_memory_utilization: 0.40
layout:
  rollout_gpus: [0]
  actor_gpus: [1, 2]
# Disaggregated rollout/actor placement needs verl's async trainer (separate rollout pool);
# the colocated main_ppo entry point would instead share GPUs between rollout and actor.
entrypoint: recipe.fully_async_policy.fully_async_main
verl:
  algorithm:
    adv_estimator: grpo
    use_kl_in_reward: false
  data:
    train_files: data/rl/train.parquet     # one row per persona: prompt + gold (reward_model.ground_truth)
    val_files: data/rl/val.parquet
    train_batch_size: 32                   # personas per step
    max_prompt_length: 4096
    max_response_length: 12288
    return_raw_chat: true
  actor_rollout_ref:
    model:
      path: ${policy}
      enable_gradient_checkpointing: true
      use_remove_padding: true
    actor:
      strategy: fsdp2
      optim: { lr: 1.0e-6 }
      ppo_mini_batch_size: 32
      ppo_micro_batch_size_per_gpu: 1
      use_kl_loss: true
      kl_loss_coef: 0.001
      kl_loss_type: low_var_kl
      entropy_coeff: 0.0
      loss_agg_mode: seq-mean-token-mean
      fsdp_config: { param_offload: false, optimizer_offload: true }
    rollout:
      name: vllm
      mode: async
      n: 8                                 # GRPO group size
      temperature: 1.0
      tensor_model_parallel_size: 1
      gpu_memory_utilization: 0.45
      multi_turn:
        enable: true
        format: hermes                     # Qwen3 <tool_call> format
        max_assistant_turns: 12
        max_user_turns: 12
        tool_config_path: rl/tools.yaml
        interaction_config_path: rl/interaction.yaml
    ref:
      fsdp_config: { param_offload: true }
  custom_reward_function:
    path: rl/reward_plugin.py
    name: compute_score
  rollout:                                 # rollout pool: GPU 0
    nnodes: 1
    n_gpus_per_node: 1
  trainer:
    project_name: lotse-rl
    experiment_name: grpo-a3b
    nnodes: 1
    n_gpus_per_node: 2                     # actor pool; the rollout pool is GPU 0
    total_epochs: 1
    total_training_steps: 400
    save_freq: 25
    test_freq: 25
    logger: [console, wandb]
