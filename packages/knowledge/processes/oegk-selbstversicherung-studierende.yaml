# SV-Box: data/svbox/Leistungskataloge/Serviceratgeber-2026_Broschuere_A5_OEAM_99-19_klein_korr.pdf
# PDF-Seite 11 (1-basiert), Druckseiten 21.
# Quellenstand der Broschüre: 01.01.2026; Abrufdatum in sources.
# Keine abschließende Anspruchsberechnung aus dem PDF: Einkommens- und Studiengrenzen durch ÖGK prüfen lassen.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
# Abschluss bestätigt die Verwaltungshilfe bzw. Rückfrage, keinen Leistungsanspruch.
# Erinnerungen nach 0 Tagen sind Aufgabenhinweise, keine gesetzlichen Fristen.
id: oegk-selbstversicherung-studierende
benefit: ref:catalog/oegk-selbstversicherung-studierende
actor_roles:
  - subject
  - helper
slots:
  - id: contact_region
    type: enum:oegk-region
    question_hint: In welchem Bundesland befindet sich Ihre zuständige ÖGK-Stelle laut
      Versicherungsunterlagen? Bei Selbstversicherung mit geringfügiger Beschäftigung nennen Sie das
      Beschäftigungsbundesland.
    validation:
      options:
        - Wien
        - Niederösterreich
        - Burgenland
        - Oberösterreich
        - Steiermark
        - Kärnten
        - Salzburg
        - Tirol
        - Vorarlberg
  - id: domestic_stay
    type: boolean
    question_hint: Ist Ihr gewöhnlicher Aufenthalt in Österreich?
  - id: documents_ready
    type: boolean
    question_hint: Sind die genannten Unterlagen vollständig vorbereitet?
  - id: contact_done
    type: boolean
    question_hint:
      Haben Sie die Unterlagen selbst übermittelt oder die Abwicklung mit der zuständigen
      Stelle geklärt?
  - id: clarification_done
    type: boolean
    question_hint:
      Haben Sie die offenen Voraussetzungen mit der ÖGK geklärt? Eine Leistungszusage kann
      nur die zuständige Stelle geben.
steps:
  - id: check-requirements
    needs:
      - contact_region
      - domestic_stay
    criteria: ref:catalog/oegk-selbstversicherung-studierende#criteria
    action: office.resolve
    outputs:
      - id: contact-office
        type: office
    transitions:
      - to: prepare
        when: (domestic_stay == true)
      - to: clarify
        when: not ((domestic_stay == true))
  - id: prepare
    needs:
      - check-requirements
      - documents_ready
    documents: ref:catalog/oegk-selbstversicherung-studierende#documents
    action: documents.checklist
    outputs:
      - id: administrative-checklist
        type: checklist
    transitions:
      - to: confirm-contact
        when: documents_ready == true
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die fehlenden Unterlagen bei den genannten Stellen. Medizinische Angaben
          bleiben bei den behandelnden Fachpersonen.
        when: documents_ready == false
  - id: confirm-contact
    needs:
      - prepare
      - contact_done
    outputs:
      - id: contact-confirmation
        type: confirmation
    transitions:
      - to: finish
        when: contact_done == true
  - id: finish
    needs:
      - confirm-contact
    outputs:
      - id: navigation-complete
        type: confirmation
  - id: clarify
    needs:
      - check-requirements
      - clarification_done
    outputs:
      - id: carrier-clarification
        type: handoff
    transitions:
      - to: finish-clarification
        when: clarification_done == true
    reminders:
      - after_days: 0
        text_de: Bitte klären Sie die offenen Voraussetzungen mit der ÖGK.
        when: clarification_done == false
  - id: finish-clarification
    needs:
      - clarify
    outputs:
      - id: clarification-complete
        type: confirmation
completion:
  evidence:
    - user_statement
sources:
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote: "Für Studierende gibt es zusätzliche Erleichterungen. Einerseits entfällt die Wartezeit,
      andererseits genügt der gewöhnliche Aufenthalt im Inland. Außerdem gilt: Der monatliche
      Beitrag beträgt 78,84 Euro. Die begünstigte Studentenversicherung ist an Einkommensgrenzen und
      Studiendauer gebunden."
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=12
    quote:
      Studierende müssen bei Antragstellung und in der Folge jährlich spätestens bis 31.12. eines
      jeden Kalenderjahres eine Fortsetzungsbestätigung bzw. ein Studienblatt des aktuellen
      Semesters vorlegen.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.868713&portal=oegkportal
    quote: Die Selbstversicherung kostet 2026 monatlich EUR 78,84.
    retrieved_at: 2026-11-06T00:07:42.653242Z
as_of: 2026-01-01
