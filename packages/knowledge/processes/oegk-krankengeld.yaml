# SV-Box: data/svbox/Leistungskataloge/Serviceratgeber-2026_Broschuere_A5_OEAM_99-19_klein_korr.pdf
# PDF-Seite 27 (1-basiert), Druckseiten 53–58.
# Quellenstand der Broschüre: 01.01.2026; Abrufdatum in sources.
# Kein gesonderter Antrag für reguläre Auszahlung; Unterlagen und Bankverbindung reichen. Besonderes Krankengeld gesondert mit ÖGK klären (PDF S. 56–58).
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
# Abschluss bestätigt die Verwaltungshilfe bzw. Rückfrage, keinen Leistungsanspruch.
# Erinnerungen nach 0 Tagen sind Aufgabenhinweise, keine gesetzlichen Fristen.
id: oegk-krankengeld
benefit: ref:catalog/oegk-krankengeld
actor_roles:
  - subject
  - helper
slots:
  - id: contact_region
    type: enum:oegk-region
    question_hint: In welchem Bundesland befindet sich Ihre zuständige ÖGK-Stelle laut
      Versicherungsunterlagen? Bei Selbstversicherung mit geringfügiger Beschäftigung nennen Sie das
      Beschäftigungsbundesland.
    validation:
      options:
        - Wien
        - Niederösterreich
        - Burgenland
        - Oberösterreich
        - Steiermark
        - Kärnten
        - Salzburg
        - Tirol
        - Vorarlberg
  - id: sick_note_reported
    type: boolean
    question_hint: Wurde die ärztliche Krankmeldung bereits an die ÖGK übermittelt?
  - id: employment_status
    type: enum:employment-status
    question_hint: Sind Sie beschäftigt, beim AMS oder nach § 19a ASVG selbstversichert?
    validation:
      options:
        - employed
        - ams
        - minor-self-insured
        - other
  - id: documents_ready
    type: boolean
    question_hint: Sind die genannten Unterlagen vollständig vorbereitet?
  - id: contact_done
    type: boolean
    question_hint:
      Haben Sie die Unterlagen selbst übermittelt oder die Abwicklung mit der zuständigen
      Stelle geklärt?
  - id: clarification_done
    type: boolean
    question_hint:
      Haben Sie die offenen Voraussetzungen mit der ÖGK geklärt? Eine Leistungszusage kann
      nur die zuständige Stelle geben.
steps:
  - id: check-requirements
    needs:
      - contact_region
      - sick_note_reported
      - employment_status
    criteria: ref:catalog/oegk-krankengeld#criteria
    action: office.resolve
    outputs:
      - id: contact-office
        type: office
    transitions:
      - to: prepare
        when: (sick_note_reported == true)
      - to: clarify
        when: not ((sick_note_reported == true))
  - id: prepare
    needs:
      - check-requirements
      - documents_ready
    documents: ref:catalog/oegk-krankengeld#documents
    action: documents.checklist
    outputs:
      - id: administrative-checklist
        type: checklist
    transitions:
      - to: confirm-contact
        when: documents_ready == true
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die fehlenden Unterlagen bei den genannten Stellen. Medizinische Angaben
          bleiben bei den behandelnden Fachpersonen.
        when: documents_ready == false
  - id: confirm-contact
    needs:
      - prepare
      - contact_done
    outputs:
      - id: contact-confirmation
        type: confirmation
    transitions:
      - to: finish
        when: contact_done == true
  - id: finish
    needs:
      - confirm-contact
    outputs:
      - id: navigation-complete
        type: confirmation
  - id: clarify
    needs:
      - check-requirements
      - clarification_done
    outputs:
      - id: carrier-clarification
        type: handoff
    transitions:
      - to: finish-clarification
        when: clarification_done == true
    reminders:
      - after_days: 0
        text_de: Bitte klären Sie die offenen Voraussetzungen mit der ÖGK.
        when: clarification_done == false
  - id: finish-clarification
    needs:
      - clarify
    outputs:
      - id: clarification-complete
        type: confirmation
completion:
  evidence:
    - user_statement
sources:
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
    quote: "Dabei gilt: Halber Lohn-/Gehaltsanspruch bedeutet halbes Krankengeld."
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
    quote:
      wenn und solange die Arbeitsunfähigkeit der ÖGK nicht gemeldet wird. Das wird in der Regel
      von der Ärztin bzw. vom Arzt für Sie erledigt.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
    quote:
      "Um Ihnen das Krankengeld auszahlen zu können, benötigen wir von Ihnen folgende Unterlagen: y
      Krankmeldung y Eine „Arbeits- und Entgeltbestätigung”, die Angaben über die Einkommenshöhe und
      die Dauer einer eventuellen Entgeltfortzahlung enthält. Diese wird von der Dienstgeberin bzw.
      dem Dienstgeber ausgestellt."
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
    quote: Vergessen Sie bitte auch nicht, uns Ihre Bankverbindung bekanntzugeben.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.867467&portal=oegkportal
    quote: Krankengeld gebührt frühestens ab dem vierten Tag eines Krankenstandes.
    retrieved_at: 2026-11-06T00:07:42.653242Z
as_of: 2026-01-01
