# SV-Box: data/svbox/Leistungskataloge/Serviceratgeber-2026_Broschuere_A5_OEAM_99-19_klein_korr.pdf
# PDF-Seite 11 (1-basiert), Druckseiten 20.
# Quellenstand der Broschüre: 01.01.2026; Abrufdatum in sources.
# Die ÖGK prüft Vorversicherung, Versicherungsbeginn und Ausnahmen. Einkommensnachweise betreffen nur die optionale Beitragsherabsetzung.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
# Abschluss bestätigt die Verwaltungshilfe bzw. Rückfrage, keinen Leistungsanspruch.
# Erinnerungen nach 0 Tagen sind Aufgabenhinweise, keine gesetzlichen Fristen.
id: oegk-selbstversicherung
benefit: ref:catalog/oegk-selbstversicherung
actor_roles:
  - subject
  - helper
slots:
  - id: contact_region
    type: enum:oegk-region
    question_hint: In welchem Bundesland befindet sich Ihre zuständige ÖGK-Stelle laut
      Versicherungsunterlagen? Bei Selbstversicherung mit geringfügiger Beschäftigung nennen Sie das
      Beschäftigungsbundesland.
    validation:
      options:
        - Wien
        - Niederösterreich
        - Burgenland
        - Oberösterreich
        - Steiermark
        - Kärnten
        - Salzburg
        - Tirol
        - Vorarlberg
  - id: compulsory_cover
    type: boolean
    question_hint: Sind Sie derzeit gesetzlich pflichtversichert?
  - id: domestic_residence
    type: boolean
    question_hint: Haben Sie Ihren Wohnsitz in Österreich?
  - id: documents_ready
    type: boolean
    question_hint: Sind die genannten Unterlagen vollständig vorbereitet?
  - id: contact_done
    type: boolean
    question_hint:
      Haben Sie die Unterlagen selbst übermittelt oder die Abwicklung mit der zuständigen
      Stelle geklärt?
  - id: clarification_done
    type: boolean
    question_hint:
      Haben Sie die offenen Voraussetzungen mit der ÖGK geklärt? Eine Leistungszusage kann
      nur die zuständige Stelle geben.
steps:
  - id: check-requirements
    needs:
      - contact_region
      - compulsory_cover
      - domestic_residence
    criteria: ref:catalog/oegk-selbstversicherung#criteria
    action: office.resolve
    outputs:
      - id: contact-office
        type: office
    transitions:
      - to: prepare
        when: (compulsory_cover == false and domestic_residence == true)
      - to: clarify
        when: not ((compulsory_cover == false and domestic_residence == true))
  - id: prepare
    needs:
      - check-requirements
      - documents_ready
    documents: ref:catalog/oegk-selbstversicherung#documents
    action: documents.checklist
    outputs:
      - id: administrative-checklist
        type: checklist
    transitions:
      - to: confirm-contact
        when: documents_ready == true
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die fehlenden Unterlagen bei den genannten Stellen. Medizinische Angaben
          bleiben bei den behandelnden Fachpersonen.
        when: documents_ready == false
  - id: confirm-contact
    needs:
      - prepare
      - contact_done
    outputs:
      - id: contact-confirmation
        type: confirmation
    transitions:
      - to: finish
        when: contact_done == true
  - id: finish
    needs:
      - confirm-contact
    outputs:
      - id: navigation-complete
        type: confirmation
  - id: clarify
    needs:
      - check-requirements
      - clarification_done
    outputs:
      - id: carrier-clarification
        type: handoff
    transitions:
      - to: finish-clarification
        when: clarification_done == true
    reminders:
      - after_days: 0
        text_de: Bitte klären Sie die offenen Voraussetzungen mit der ÖGK.
        when: clarification_done == false
  - id: finish-clarification
    needs:
      - clarify
    outputs:
      - id: clarification-complete
        type: confirmation
completion:
  evidence:
    - user_statement
sources:
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote:
      Personen, die nicht in einer gesetzlichen Krankenversicherung pflichtversichert sind, können
      sich auf Antrag selbst versichern – solange sich ihr Wohnsitz im Inland befindet. Das ist die
      „Freiwillige Krankenversicherung nach § 16 ASVG”.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote:
      Bei Vorliegen der erforderlichen Vorversicherungszeiten haben die Versicherten für sich und
      ihre anspruchsberechtigten Angehörigen sofort Anspruch auf Leistungen aus der
      Krankenversicherung, sonst nach einer Wartezeit von sechs Monaten.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote:
      Der Monatsbeitrag beträgt derzeit 565,25 Euro. Sie können einen Antrag auf Herabsetzung der
      Beitragsgrundlage stellen.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.867315&portal=oegkportal
    quote:
      "Für die Anmeldung der Selbstversicherung in der Krankenversicherung benötigen wir folgende
      Dokumente: vollständig ausgefülltes und unterschriebenes Antragsformular Lichtbildausweis
      Meldebestätigung"
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote:
      Sie können einen Antrag auf Herabsetzung der Beitragsgrundlage stellen. Legen Sie dem Antrag
      sämtliche Einkommensnachweise bei.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.867315&portal=oegkportal
    quote: Ihr Wohnsitz ist im Inland.
    retrieved_at: 2026-11-06T00:07:42.653242Z
as_of: 2026-01-01
