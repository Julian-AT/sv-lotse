# SV-Box: data/svbox/Leistungskataloge/Serviceratgeber-2026_Broschuere_A5_OEAM_99-19_klein_korr.pdf
# PDF-Seite 20 (1-basiert), Druckseiten 38.
# Quellenstand der Broschüre: 01.01.2026; Abrufdatum in sources.
# Vertragsbehandlung und private Rechnung unterscheiden. Keine Wahl oder Empfehlung einer Behandlung; nur Verwaltung einer bereits verordneten Leistung.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
# Abschluss bestätigt die Verwaltungshilfe bzw. Rückfrage, keinen Leistungsanspruch.
# Erinnerungen nach 0 Tagen sind Aufgabenhinweise, keine gesetzlichen Fristen.
id: oegk-ergotherapie
benefit: ref:catalog/oegk-ergotherapie
actor_roles:
  - subject
  - helper
slots:
  - id: contact_region
    type: enum:oegk-region
    question_hint: In welchem Bundesland befindet sich Ihre zuständige ÖGK-Stelle laut
      Versicherungsunterlagen? Bei Selbstversicherung mit geringfügiger Beschäftigung nennen Sie das
      Beschäftigungsbundesland.
    validation:
      options:
        - Wien
        - Niederösterreich
        - Burgenland
        - Oberösterreich
        - Steiermark
        - Kärnten
        - Salzburg
        - Tirol
        - Vorarlberg
  - id: prescription_present
    type: boolean
    question_hint: Liegt eine ärztliche Verordnung für die bereits vorgesehene Behandlung vor?
  - id: documents_ready
    type: boolean
    question_hint: Sind die genannten Unterlagen vollständig vorbereitet?
  - id: contact_done
    type: boolean
    question_hint:
      Haben Sie die Unterlagen selbst übermittelt oder die Abwicklung mit der zuständigen
      Stelle geklärt?
  - id: clarification_done
    type: boolean
    question_hint:
      Haben Sie die offenen Voraussetzungen mit der ÖGK geklärt? Eine Leistungszusage kann
      nur die zuständige Stelle geben.
  - id: private_invoice
    type: boolean
    question_hint: Haben Sie eine private Rechnung für die bereits vorgesehene Leistung? Bei
      Vertragsbehandlung erfolgt die Abrechnung mit der ÖGK.
  - id: invoice_ready
    type: boolean
    question_hint: Ist die detaillierte Rechnung bezahlt und für die ÖGK vorbereitet?
steps:
  - id: check-requirements
    needs:
      - contact_region
      - prescription_present
    criteria: ref:catalog/oegk-ergotherapie#criteria
    action: office.resolve
    outputs:
      - id: contact-office
        type: office
    transitions:
      - to: prepare
        when: (prescription_present == true)
      - to: clarify
        when: not ((prescription_present == true))
  - id: prepare
    needs:
      - check-requirements
      - documents_ready
      - private_invoice
    documents: ref:catalog/oegk-ergotherapie#documents
    action: documents.checklist
    outputs:
      - id: administrative-checklist
        type: checklist
    transitions:
      - to: prepare-invoice
        when: documents_ready == true and private_invoice == true
      - to: confirm-contact
        when: documents_ready == true and private_invoice == false
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die fehlenden Unterlagen bei den genannten Stellen. Medizinische Angaben
          bleiben bei den behandelnden Fachpersonen.
        when: documents_ready == false
  - id: prepare-invoice
    needs:
      - prepare
      - invoice_ready
    outputs:
      - id: paid-invoice-checklist
        type: checklist
    transitions:
      - to: confirm-contact
        when: invoice_ready == true
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die bezahlte detaillierte Rechnung bei der behandelnden Fachperson. Die
          ÖGK prüft die Erstattung.
        when: invoice_ready == false
  - id: confirm-contact
    needs:
      - prepare
      - contact_done
    outputs:
      - id: contact-confirmation
        type: confirmation
    transitions:
      - to: finish
        when: contact_done == true
  - id: finish
    needs:
      - confirm-contact
    outputs:
      - id: navigation-complete
        type: confirmation
  - id: clarify
    needs:
      - check-requirements
      - clarification_done
    outputs:
      - id: carrier-clarification
        type: handoff
    transitions:
      - to: finish-clarification
        when: clarification_done == true
    reminders:
      - after_days: 0
        text_de: Bitte klären Sie die offenen Voraussetzungen mit der ÖGK.
        when: clarification_done == false
  - id: finish-clarification
    needs:
      - clarify
    outputs:
      - id: clarification-complete
        type: confirmation
completion:
  evidence:
    - user_statement
sources:
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=20
    quote: Wir bieten unseren Versicherten Ergotherapie, Logopädie und Physiotherapie nach
      vorhergehender Verordnung an.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870178&portal=oegkportal
    quote: die bezahlte Honorarnote (Original oder Duplikat)
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870178&portal=oegkportal
    quote:
      Ergotherapeutische Behandlungen bei einer Vertragspartnerin oder einem Vertragspartner sind
      für Sie kostenlos.
    retrieved_at: 2026-11-06T00:07:42.653242Z
as_of: 2026-01-01
