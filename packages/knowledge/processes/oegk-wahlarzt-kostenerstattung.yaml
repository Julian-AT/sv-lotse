# SV-Box: data/svbox/Leistungskataloge/Serviceratgeber-2026_Broschuere_A5_OEAM_99-19_klein_korr.pdf
# PDF-Seite 18 (1-basiert), Druckseiten 34–35.
# Quellenstand der Broschüre: 01.01.2026; Abrufdatum in sources.
# Erstattung richtet sich nach Vertragstarif, nicht Rechnungsbetrag; keine individuelle Erstattungssumme berechnen.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
# Abschluss bestätigt die Verwaltungshilfe bzw. Rückfrage, keinen Leistungsanspruch.
# Erinnerungen nach 0 Tagen sind Aufgabenhinweise, keine gesetzlichen Fristen.
# fees.explainReimbursement liefert nur illustrative, unverbindliche Beträge mit Region und Stand.
# Das Einreichpaket stellt Unterlagen und Einreichwege zusammen; die Einreichung nehmen die Versicherten selbst vor.
id: oegk-wahlarzt-kostenerstattung
benefit: ref:catalog/oegk-wahlarzt-kostenerstattung
actor_roles:
  - subject
  - helper
slots:
  - id: contact_region
    type: enum:oegk-region
    question_hint: In welchem Bundesland befindet sich Ihre zuständige ÖGK-Stelle laut
      Versicherungsunterlagen? Bei Selbstversicherung mit geringfügiger Beschäftigung nennen Sie das
      Beschäftigungsbundesland.
    validation:
      options:
        - Wien
        - Niederösterreich
        - Burgenland
        - Oberösterreich
        - Steiermark
        - Kärnten
        - Salzburg
        - Tirol
        - Vorarlberg
  - id: invoice_paid
    type: boolean
    question_hint: Ist die Arztrechnung bereits vollständig bezahlt?
  - id: documents_ready
    type: boolean
    question_hint: Liegen bezahlte Honorarnote, Zahlungsnachweis und, falls nötig, die Überweisung
      vollständig vor?
  - id: contact_done
    type: boolean
    question_hint:
      Haben Sie die Unterlagen über Meine ÖGK oder per Post eingereicht, oder hat Ihre Wahlärztin
      oder Ihr Wahlarzt sie über WAHonline übermittelt?
  - id: clarification_done
    type: boolean
    question_hint:
      Haben Sie die offenen Voraussetzungen mit der ÖGK geklärt? Eine Leistungszusage kann
      nur die zuständige Stelle geben.
steps:
  - id: check-requirements
    needs:
      - contact_region
      - invoice_paid
    criteria: ref:catalog/oegk-wahlarzt-kostenerstattung#criteria
    action: office.resolve
    outputs:
      - id: contact-office
        type: office
    transitions:
      - to: explain-reimbursement
        when: (invoice_paid == true)
      - to: clarify
        when: not ((invoice_paid == true))
  - id: explain-reimbursement
    needs:
      - check-requirements
    action: fees.explainReimbursement
    outputs:
      - id: illustrative-reimbursement
        type: information
    transitions:
      - to: build-package
  - id: build-package
    needs:
      - explain-reimbursement
      - documents_ready
    criteria: ref:catalog/oegk-wahlarzt-kostenerstattung#criteria
    documents: ref:catalog/oegk-wahlarzt-kostenerstattung#documents
    action: documents.checklist
    outputs:
      - id: submission-package
        type: checklist
    transitions:
      - to: confirm-contact
        when: documents_ready == true
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die fehlenden Unterlagen bei den genannten Stellen. Medizinische Angaben
          bleiben bei den behandelnden Fachpersonen.
        when: documents_ready == false
  - id: confirm-contact
    needs:
      - build-package
      - contact_done
    outputs:
      - id: contact-confirmation
        type: confirmation
    transitions:
      - to: finish
        when: contact_done == true
  - id: finish
    needs:
      - confirm-contact
    outputs:
      - id: navigation-complete
        type: confirmation
  - id: clarify
    needs:
      - check-requirements
      - clarification_done
    outputs:
      - id: carrier-clarification
        type: handoff
    transitions:
      - to: finish-clarification
        when: clarification_done == true
    reminders:
      - after_days: 0
        text_de: Bitte klären Sie die offenen Voraussetzungen mit der ÖGK.
        when: clarification_done == false
  - id: finish-clarification
    needs:
      - clarify
    outputs:
      - id: clarification-complete
        type: confirmation
completion:
  evidence:
    - user_statement
sources:
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=18
    quote: Versicherte müssen das Honorar zunächst selbst bezahlen.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
    quote:
      Die ÖGK erstattet die Kosten eines Wahlarztes oder einer Wahlärztin grundsätzlich in der Höhe
      von 80 Prozent jenes Betrages, den die ÖGK bei Inanspruchnahme eines entsprechenden
      Vertragspartners bzw. einer Vertragspartnerin aufwenden hätte müssen, jedoch nicht mehr als
      die tatsächlichen Kosten.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=18
    quote:
      Die Honorarnote muss Vor- und Familiennamen der bzw. des Versicherten, Versicherungsnummer,
      Wohnadresse, Zahlungsbestätigung, das Ausstellungsdatum und genaue Angaben über die ärztlichen
      Leistungen samt Datum enthalten.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
    quote: In den meisten Fällen erstattet Ihnen die ÖGK einen Teil der Kosten zurück.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
    quote: Fertig ausdrucken und per Post schicken
    retrieved_at: 2026-11-06T03:45:00Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
    quote: >-
      Zahlungsnachweis bei Barzahlung: Zahlungsvermerk auf der Honorarnote bei Zahlung mit
      Erlagschein: Einzahlungsabschnitt (auch Kopie) bei elektronischer Bezahlung: Nachweis der
      Abbuchung (z.B. Protokollauszug, Bankauszug)
    retrieved_at: 2026-11-06T03:45:00Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
    quote: Wahlärztinnen und Wahlärzte, die pro Jahr mindestens 300 Patientinnen und Patienten
      betreuen, sind seit 1.7.2024 verpflichtet, die Anträge auf Kostenerstattung für ihre
      Patientinnen und Patienten einzureichen. Dafür nutzen sie das System WAHonline.
    retrieved_at: 2026-11-06T03:45:00Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
    quote: Sie bekommen selten 80 Prozent des Rechnungsbetrages erstattet, weil die Tarife von
      Wahlärztinnen und Wahlärzten meist höher sind als jene der Kassen.
    retrieved_at: 2026-11-06T03:45:00Z
as_of: 2026-11-06
