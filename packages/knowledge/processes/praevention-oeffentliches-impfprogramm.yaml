# Awaiting human review; administrative access only.
id: praevention-oeffentliches-impfprogramm
benefit: ref:catalog/praevention-oeffentliches-impfprogramm
actor_roles:
  - subject
  - helper
slots:
  - id: region
    type: string
    question_hint: In welchem Bundesland suchen Sie ein Angebot?
  - id: documented-entries
    type: fact:vaccination_record
    from_context: vaccination_record
    question_hint: Möchten Sie Ihren Impfpass importieren und die dokumentierten
      Impfeinträge bestätigen?
steps:
  - id: programme-information
    needs: []
    criteria: ref:catalog/praevention-oeffentliches-impfprogramm#criteria
    outputs:
      - id: published-programme
        type: document
    transitions:
      - to: prepare-access
  - id: prepare-access
    needs:
      - region
    outputs:
      - id: official-access
        type: document
    transitions:
      - to: finish
  - id: finish
    needs: []
    outputs:
      - id: access-summary
        type: document
completion:
  evidence:
    - user_statement
sources:
  - url: https://impfen.gv.at/impfungen/influenza
    quote: Die Influenza-Impfung ist im Rahmen des öffentlichen Impfprogramms von
      Bund, Länder und Sozialversicherung für alle gratis.
    retrieved_at: 2026-11-06T01:36:22Z
  - url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.890481&filter-preselect=%22Vorsorgen%22&portal=oegkportal
    quote: Impfen ist ein wirksamer Schutz gegen bestimmte Infektionskrankheiten.
    retrieved_at: 2026-11-06T01:36:22Z
  - url: https://www.gesundheit.gv.at/gesundheitsleistungen/elga/elektronischer-impfpass.html
    quote: Man kann seine Impfungen über Mein Gesundheitsportal im eImpfpass
      einsehen und ausdrucken.
    retrieved_at: 2026-11-06T01:36:22Z
as_of: 2026-11-06
