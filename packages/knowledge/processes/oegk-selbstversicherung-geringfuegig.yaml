# SV-Box: data/svbox/Leistungskataloge/Serviceratgeber-2026_Broschuere_A5_OEAM_99-19_klein_korr.pdf
# PDF-Seite 11 (1-basiert), Druckseiten 21–22.
# Quellenstand der Broschüre: 01.01.2026; Abrufdatum in sources.
# Zuständigkeit nach Beschäftigungsbundesland, nicht Wohnort. Dienstleistungsscheck und Auslandswohnsitz sind Sonderfälle; reguläre Grenze ist keine abschließende Anspruchsprüfung.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
# Abschluss bestätigt die Verwaltungshilfe bzw. Rückfrage, keinen Leistungsanspruch.
# Erinnerungen nach 0 Tagen sind Aufgabenhinweise, keine gesetzlichen Fristen.
id: oegk-selbstversicherung-geringfuegig
benefit: ref:catalog/oegk-selbstversicherung-geringfuegig
actor_roles:
  - subject
  - helper
slots:
  - id: contact_region
    type: enum:oegk-region
    question_hint: In welchem Bundesland befindet sich Ihre zuständige ÖGK-Stelle laut
      Versicherungsunterlagen? Bei Selbstversicherung mit geringfügiger Beschäftigung nennen Sie das
      Beschäftigungsbundesland.
    validation:
      options:
        - Wien
        - Niederösterreich
        - Burgenland
        - Oberösterreich
        - Steiermark
        - Kärnten
        - Salzburg
        - Tirol
        - Vorarlberg
  - id: minor_employment
    type: boolean
    question_hint: Üben Sie eine geringfügige Beschäftigung aus?
  - id: compulsory_cover
    type: boolean
    question_hint: Besteht schon eine Pflichtversicherung in der Kranken- oder Pensionsversicherung?
  - id: monthly_income
    type: number
    question_hint: Wie hoch ist Ihr gesamtes monatliches Entgelt in Euro?
  - id: documents_ready
    type: boolean
    question_hint: Sind die genannten Unterlagen vollständig vorbereitet?
  - id: contact_done
    type: boolean
    question_hint:
      Haben Sie die Unterlagen selbst übermittelt oder die Abwicklung mit der zuständigen
      Stelle geklärt?
  - id: clarification_done
    type: boolean
    question_hint:
      Haben Sie die offenen Voraussetzungen mit der ÖGK geklärt? Eine Leistungszusage kann
      nur die zuständige Stelle geben.
steps:
  - id: check-requirements
    needs:
      - contact_region
      - minor_employment
      - compulsory_cover
      - monthly_income
    criteria: ref:catalog/oegk-selbstversicherung-geringfuegig#criteria
    action: office.resolve
    outputs:
      - id: contact-office
        type: office
    transitions:
      - to: prepare
        when: (minor_employment == true and compulsory_cover == false and monthly_income <= 551.10)
      - to: clarify
        when: not ((minor_employment == true and compulsory_cover == false and monthly_income <= 551.10))
  - id: prepare
    needs:
      - check-requirements
      - documents_ready
    documents: ref:catalog/oegk-selbstversicherung-geringfuegig#documents
    action: documents.checklist
    outputs:
      - id: administrative-checklist
        type: checklist
    transitions:
      - to: confirm-contact
        when: documents_ready == true
    reminders:
      - after_days: 0
        text_de:
          Bitte besorgen Sie die fehlenden Unterlagen bei den genannten Stellen. Medizinische Angaben
          bleiben bei den behandelnden Fachpersonen.
        when: documents_ready == false
  - id: confirm-contact
    needs:
      - prepare
      - contact_done
    outputs:
      - id: contact-confirmation
        type: confirmation
    transitions:
      - to: finish
        when: contact_done == true
  - id: finish
    needs:
      - confirm-contact
    outputs:
      - id: navigation-complete
        type: confirmation
  - id: clarify
    needs:
      - check-requirements
      - clarification_done
    outputs:
      - id: carrier-clarification
        type: handoff
    transitions:
      - to: finish-clarification
        when: clarification_done == true
    reminders:
      - after_days: 0
        text_de: Bitte klären Sie die offenen Voraussetzungen mit der ÖGK.
        when: clarification_done == false
  - id: finish-clarification
    needs:
      - clarify
    outputs:
      - id: clarification-complete
        type: confirmation
completion:
  evidence:
    - user_statement
sources:
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote: Die Voraussetzungen sind, dass Sie nur geringfügig beschäftigt sind und noch keine
      Pflichtversicherung in der Kranken- und/oder Pensionsversicherung haben. Das Entgelt, das Sie
      erhalten, darf die jeweils gültige Geringfügigkeitsgrenze nicht übersteigen. Die
      Geringfügigkeitsgrenze liegt im Jahr 2026 bei 551,10 Euro.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
    quote: Geringfügig Beschäftigte mit Wohnsitz im Inland können sich in der Kranken- und
      Pensionsversicherung zu einem monatlichen Beitrag von derzeit 83,49 Euro selbst versichern.
      Das ist die „Selbstversicherung in der Kranken- und Pensionsversicherung nach § 19a ASVG”.
    retrieved_at: 2026-11-06T00:07:42.653242Z
  - url: https://www.oegk.at/cdscontent/?contentid=10007.870435&portal=oegkportal
    quote:
      Den Antrag auf Selbstversicherung bei geringfügiger Beschäftigung (§ 19a ASVG) stellen Sie
      bei der Österreichischen Gesundheitskasse
    retrieved_at: 2026-11-06T00:07:42.653242Z
as_of: 2026-01-01
