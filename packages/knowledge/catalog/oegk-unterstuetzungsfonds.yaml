id: oegk-unterstuetzungsfonds
name_de: Unterstützungsfonds
name_simple: Hilfe bei hohen Gesundheitskosten beantragen
area: F
life_situations:
  - oegk-unterstuetzungsfonds-navigation
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: hardship
    text_de:
      Versicherte können bei finanziellen Belastungen im Zusammenhang mit einer Krankheit oder
      Behandlung, die zu einer Kassenleistung führt, einen freiwilligen Zuschuss beantragen.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=43
      quote: Bei finanziellen Belastungen im Zusammenhang mit einer Krankheit oder medizinischen
        Behandlung, die zu einer Kassenleistung führt, können Versicherte einen Zuschuss beantragen.
        Dabei werden die Familien-, Einkommens- und Vermögensverhältnisse der betroffenen Person
        berücksichtigt.
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: household
    text_de:
      Familien-, Einkommens- und Vermögensverhältnisse werden berücksichtigt; Einkommensnachweise
      aller Haushaltsmitglieder beilegen.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=43
      quote:
        Stellen Sie für einen Zuschuss aus dem Unterstützungsfonds einen schriftlichen Antrag und
        legen Sie diesen den entsprechenden Unterlagen bei. Wesentlich sind unter anderem die
        Einkommensnachweise von allen im gemeinsamen Haushalt lebenden Personen (z.B. Lohn- und
        Gehaltszettel, Pensionsnachweis) sowie Rechnungen und Kostenvoranschläge.
      retrieved_at: 2026-11-06T00:07:42.653242Z
