# Carrier rules select an intake contact, not medical eligibility.
# SVS, BVAEB and AUVA central offices clarify or forward regional requests.
# Booking channels remain empty pending human verification.
id: medical-rehabilitation
name_de: Medizinische Rehabilitation einschließlich Anschlussheilverfahren
name_simple: Hilfe beim Antrag auf Reha
area: C
life_situations:
  - care
  - after-hospital
scope: social_insurance
carriers:
  - pva
  - svs
  - bvaeb
  - auva
  - oegk
criteria:
  - id: prior-application
    text_de: Für eine medizinische Reha ist ein Antrag nötig.
    condition: application_ready == true
    legal_basis: "§ 154a Abs. 3 ASVG (SozDok, in Kraft seit 2020-01-01; ASVG=PARA=154a=106=2024-07-19=2020-01-01)"
    source: &a2
      url: https://www.gesundheit.gv.at/gesundheitsleistungen/kur-reha/medizinische-rehabilitation.html
      quote: Maßnahmen der medizinischen Rehabilitation werden nur aufgrund eines Antrages erbracht.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: responsible-carrier
    text_de:
      Antrag beim Pensions- oder Unfallversicherungsträger stellen. Wenn dieser nicht zuständig
      ist, leitet er den Antrag an die zuständige Krankenversicherung weiter. Die Stelle klärt die
      Zuständigkeit; eine Reha-Empfehlung allein legt keinen Träger fest.
    legal_basis: "§ 154a Abs. 3 ASVG (SozDok, in Kraft seit 2020-01-01; ASVG=PARA=154a=106=2024-07-19=2020-01-01); § 302 Abs. 2 ASVG (SozDok, in Kraft seit 2019-01-01; ASVG=PARA=302=8=2019-01-09=2019-01-01)"
    source: &a3
      url: https://www.sozialministerium.gv.at/Themen/Soziales/Sozialversicherung/Medizinische-Rehabilitationsma%C3%9Fnahmen.html
      quote:
        Die medizinischen Maßnahmen der Rehabilitation müssen beim Pensionsversicherungsträger oder
        beim Unfallversicherungsträger beantragt werden. Diese haben den Antrag unverzüglich an den
        zuständigen Krankenversicherungsträger weiterzuleiten, soweit sie diese Maßnahmen nicht
        selbst erbringen - oder zu erbringen haben.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: all-branches-service
    text_de: Ist die Zuständigkeit unklar, kann der Antrag bei jedem Sozialversicherungsträger
      eingebracht werden.
    source: &a4
      url: https://www.gesundheit.gv.at/gesundheitsleistungen/kur-reha/medizinische-rehabilitation.html
      quote:
        Es besteht die Möglichkeit, Anträge bei jedem Sozialversicherungsträger einzubringen – auch
        wenn ein anderer Versicherungsträger tatsächlich zuständig ist.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: insurance-status
    text_de:
      Bei Mehrfachversicherung mit aktiver pensionsversicherungspflichtiger Beschäftigung ist der
      jeweilige Pensionsversicherungsträger zuständig. Bei anderen Versicherungsverhältnissen die
      Zuständigkeit mit der Stelle klären.
    source: &a5
      url: https://www.bvaeb.at/cdscontent/?contentid=10007.841572
      quote: Für Rehabilitations-Ansuchen von mehrfachversicherten Personen, die in einem aktiven
        pensionsversicherungspflichtigen Beschäftigungsverhältnis stehen, ist der jeweilige
        Pensionsversicherungsträger leistungszuständig.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: self-employed-carrier
    text_de: Bei der SVS kann die Reha je nach Versicherungsverhältnis aus Unfall-, Pensions- oder
      Krankenversicherung erbracht werden.
    source: &a6
      url: https://www.svs.at/cdscontent/?contentid=10007.816821
      quote: Medizinische Maßnahmen der Rehabilitation erbringt die SVS ihren Versicherten – je nach
        Sachverhalt – sowohl aus der Unfall- und Pensionsversicherung als auch aus der
        Krankenversicherung.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: medical-section
    text_de: Das vorgesehene Formular mit der behandelnden Ärztin oder dem behandelnden Arzt
      vorbereiten. Den medizinischen Teil füllt die Ärztin oder der Arzt aus. Im Akutspital
      übernimmt dies die Spitalsärztin oder der Spitalsarzt.
    condition: doctor_section_ready == true
    source: &a1
      url: https://www.sozialministerium.gv.at/Themen/Soziales/Sozialversicherung/Medizinische-Rehabilitationsma%C3%9Fnahmen.html
      quote:
        Der Antrag für eine medizinische Rehabilitation muss über die behandelnden Ärztinnen und
        Ärzte, bei Akuterkrankungen über Spitalärztinnen und Spitalsärzte mittels des dafür
        vorgesehenen (und bei diesen Stellen aufliegenden) Antragsformulars gestellt werden.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: hospital-request
    text_de: Das Krankenhaus kann ein Anschlussheilverfahren beantragen. Ob dieses Verfahren passt,
      klärt die Spitalsärztin oder der Spitalsarzt.
    source: &a7
      url: https://www.gesundheit.gv.at/gesundheitsleistungen/kur-reha/medizinische-rehabilitation.html
      quote:
        Nach einer Operation bei Akuterkrankungen oder nach einem Unfall kann die Spitalsärztin oder
        der Spitalsarzt einen Antrag auf Anschlussheilverfahren beim zuständigen Versicherungsträger
        stellen.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: hospital-phone-request
    text_de: Bei Anschlussheilverfahren der PVA kann das Krankenhaus den Antrag auch telefonisch
      stellen. Das ist kein Telefonantrag durch die versicherte Person.
    source: &a8
      url: https://www.sozialministerium.gv.at/Themen/Soziales/Sozialversicherung/Medizinische-Rehabilitationsma%C3%9Fnahmen.html
      quote:
        Bei Anschlussheilverfahren seitens der Pensionsversicherungsanstalt kann der Antrag auch
        telefonisch durch das Krankenhaus erfolgen.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: kur-is-separate
    text_de:
      Kur und Reha sind unterschiedliche Verfahren. Für Kur/Gesundheitsvorsorge gelten höchstens
      zwei Bewilligungen in fünf Jahren. Diese Begrenzung gilt nicht für medizinische Reha.
    legal_basis: "§ 154a Abs. 6 ASVG (SozDok, in Kraft seit 2020-01-01; ASVG=PARA=154a=106=2024-07-19=2020-01-01); § 300 Abs. 4 ASVG (SozDok, in Kraft seit 2026-07-30; ASVG=PARA=300=62=2026-07-29=2026-07-30)"
    source: &a9
      url: https://www.sozialministerium.gv.at/Themen/Soziales/Sozialversicherung/Medizinische-Rehabilitationsma%C3%9Fnahmen.html
      quote: Heilverfahren (Maßnahmen der Gesundheitsvorsorge Aktiv/Kurheilverfahren) können maximal
        zweimal in einem Rahmenzeitraum von 5 Jahren bewilligt werden. Maßnahmen der medizinischen
        Rehabilitation sind von dieser Regelung ausgenommen.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: pv-approval
    text_de: Bei der PVA vor dem Aufenthalt die Bewilligung abwarten. Ohne vorherige Bewilligung
      übernimmt sie grundsätzlich keine Kosten.
    source: &a10
      url: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
      quote: Bei genehmigten Aufenthalten werden die vertraglich vereinbarten Kosten von der
        Pensionsversicherung (PV) übernommen. Kosten für Aufenthalte ohne vorherige Bewilligung
        durch die Pensionsversicherung werden grundsätzlich nicht übernommen.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: pv-copayment
    text_de:
      Bei stationärer Reha der PVA hängt die Zuzahlung vom monatlichen Bruttoeinkommen ab. Den
      Betrag bei der PVA klären.
    legal_basis: "§ 302 Abs. 4 ASVG (SozDok, in Kraft seit 2019-01-01; ASVG=PARA=302=8=2019-01-09=2019-01-01) iVm § 154a Abs. 7 ASVG (SozDok, in Kraft seit 2020-01-01; ASVG=PARA=154a=106=2024-07-19=2020-01-01)"
    source: &a11
      url: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
      quote: Für einen stationären Reha-, Kur- oder GVA-Aufenthalt müssen Sie – abhängig von Ihrem
        monatlichen Bruttoeinkommen – einen gewissen Geldbetrag dazuzahlen.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: pv-exemption
    text_de:
      Bei ambulanter Reha der PVA fällt keine Zuzahlung an. Bei sehr geringem Einkommen ist eine
      Befreiung möglich.
    legal_basis: "§ 302 Abs. 4 ASVG (SozDok, in Kraft seit 2019-01-01; ASVG=PARA=302=8=2019-01-09=2019-01-01) iVm § 154a Abs. 7 ASVG (SozDok, in Kraft seit 2020-01-01; ASVG=PARA=154a=106=2024-07-19=2020-01-01)"
    source: &a12
      url: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
      quote:
        Bei einer ambulanten Reha ist keine Zuzahlung erforderlich. Wenn Sie sehr wenig verdienen,
        ist eine Befreiung möglich.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: bvaeb-copayment
    text_de: Die BVAEB übernimmt bewilligte Aufenthalte. Die tägliche Zuzahlung bei Reha ist auf
      höchstens 28 Tage im Kalenderjahr begrenzt. Den Betrag und eine mögliche Befreiung bei der
      BVAEB klären.
    source: &a13
      url: https://www.bvaeb.at/cdscontent/?contentid=10007.841572
      quote:
        Die Kosten für einen bewilligten Aufenthalt übernimmt die BVAEB. Sie haben lediglich eine
        tägliche Zuzahlung für die gesamte Aufenthaltsdauer (für Rehabilitationsaufenthalte für
        maximal 28 Tage pro Kalenderjahr) zu bezahlen.
      retrieved_at: 2026-11-05T23:49:34.968Z
  - id: svs-exemption
    text_de: Bei der SVS sind Sie bei sozialer Schutzbedürftigkeit von der Zuzahlung befreit. Die
      Prüfung übernimmt die SVS.
    source: &a15
      url: https://www.svs.at/cdscontent/?contentid=10007.816821
      quote: Bei sozialer Schutzbedürftigkeit sind Sie von der Zuzahlung befreit.
      retrieved_at: 2026-11-05T23:49:34.968Z
