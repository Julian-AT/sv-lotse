documents:
  - id: application-form
    name_de: Ärztlich ausgefüllter Reha-Antrag; bei Anschlussheilverfahren das Krankenhausformular
    required: true
    obtain_from: Behandelnde Arztpraxis oder Krankenhaus; offizielles Formular beim
      Sozialversicherungsträger. Bei telefonischem PVA-Anschlussheilverfahren die Unterlagen mit dem
      Krankenhaus klären.
    source: *a1
  - id: relevant-findings
    name_de: "Bei SVS: maßgebliche ärztliche Befunde als Beilage"
    required: false
    obtain_from:
      Behandelnde Arztpraxis oder Krankenhaus; Auswahl der medizinischen Beilagen durch die
      Ärztin oder den Arzt.
    source: &a14
      url: https://www.svs.at/cdscontent/?contentid=10007.816821
      quote:
        Schließen Sie dem ausgefüllten Antrag maßgebliche ärztliche Befunde bei um Verzögerungen in
        der Bearbeitung durch die Anforderung medizinischer Unterlagen zu vermeiden.
      retrieved_at: 2026-11-05T23:49:34.968Z
forms:
  - search: Antrag auf Rehabilitations-, Kur- bzw. Erholungsaufenthalt
    publisher: Zuständiger Sozialversicherungsträger (PVA, SVS, BVAEB oder Krankenversicherung)
  - search: Antrag auf Anschlussheilverfahren oder Rehabilitation nach Unfall
    publisher: Zuständiger Sozialversicherungsträger; auszufüllen vom antragstellenden Krankenhaus
process: ref:processes/medical-rehabilitation
