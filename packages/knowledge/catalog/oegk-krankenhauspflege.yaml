id: oegk-krankenhauspflege
name_de: Krankenhauspflege
name_simple: Kosten für einen Spitalsaufenthalt klären
area: C
life_situations:
  - oegk-krankenhauspflege-navigation
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: general-class
    text_de: Kostenübernahme betrifft die allgemeine Gebührenklasse in fondsfinanzierten
      Krankenanstalten oder privaten Vertragskrankenanstalten; die medizinische Notwendigkeit
      beurteilen Fachpersonen.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=24
      quote:
        Wenn und solange es die Krankheit erfordert, übernimmt die ÖGK die Kosten in der allgemeinen
        Gebührenklasse einer landesgesundheitsfondsfinanzierten Krankenanstalt (z.B.
        Landeskrankenhäuser, Ordensspitäler) oder in einer privaten Vertragskrankenanstalt
        (Privatkrankenanstalten-Finanzierungsfonds) zur Gänze.
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: copayment
    text_de:
      Kostenbeiträge werden vom Krankenhaus eingehoben; für Versicherte und Angehörige längstens
      28 Tage pro Kalenderjahr. Ausnahmen sind mit dem Krankenhaus zu klären.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=24
      quote:
        Sowohl der Kostenbeitrag für Versicherte als auch der Kostenbeitrag für Angehörige ist für
        längstens 28 Tage im Kalenderjahr zu zahlen.
      retrieved_at: 2026-11-06T00:07:42.653242Z
