# Awaiting human review. Empty booking channels do not imply an unavailable service.
id: "pflegeteilzeit"
name_de: "Pflegeteilzeit"
name_simple: "Für Pflege weniger arbeiten"
area: "D"
life_situations:
  - "care"
scope: "federal"
carriers: []
criteria:
  - id: "relative-level"
    text_de: "Für nahe Angehörige mit zuerkannter Pflegegeldstufe ab 3; bei Minderjährigen oder dokumentierter Demenz ab Stufe 1. Nur Angaben aus vorhandenen Unterlagen verwenden."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "nahe Angehörige, denen zum Zeitpunkt des Antritts Pflegegeld ab Stufe 3 nach dem Bundespflegegeldgesetz (BPGG) mit Bescheid zuerkannt wurde."
      retrieved_at: "2026-11-06T00:06:59Z"
    condition: "close_relative_confirmed == true and (care_level >= 3 or (care_level >= 1 and (minor_relative == true or documented_dementia == true)))"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "lower-level-exception"
    text_de: "Bei minderjährigen nahen Angehörigen oder dokumentierter Demenz genügt Pflegegeld ab Stufe 1."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "demenziell erkrankte oder minderjährige nahe Angehörige ab Pflegegeld Stufe 1."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "employment"
    text_de: "Für die Vereinbarung muss das Arbeitsverhältnis unmittelbar davor ununterbrochen mindestens drei Monate bestehen."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Voraussetzung für den Antritt einer Pflegekarenz oder einer Pflegeteilzeit ist eine schriftliche Vereinbarung zwischen Arbeitnehmerinnen- bzw. Arbeitnehmer- und Arbeitgeberinnen- bzw. Arbeitgeberseite. Diese Vereinbarung kann getroffen werden, wenn das Arbeitsverhältnis seit ununterbrochen zumindest drei Monaten besteht."
      retrieved_at: "2026-11-06T00:06:59Z"
    condition: "employment_months >= 3"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "agreement"
    text_de: "Mit dem Arbeitgeber eine schriftliche Vereinbarung treffen. Bei einem gesetzlichen Rechtsanspruch den Arbeitgeber verständigen."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Voraussetzung für den Antritt einer Pflegekarenz oder einer Pflegeteilzeit ist eine schriftliche Vereinbarung zwischen Arbeitnehmerinnen- bzw. Arbeitnehmer- und Arbeitgeberinnen- bzw. Arbeitgeberseite. Diese Vereinbarung kann getroffen werden, wenn das Arbeitsverhältnis seit ununterbrochen zumindest drei Monaten besteht."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "duration"
    text_de: "Die vereinbarte Pflegekarenz oder Pflegeteilzeit dauert ein bis drei Monate ohne Unterbrechung."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Pflegekarenz und Pflegeteilzeit stellen Überbrückungsmaßnahmen dar. Die Dauer ist auf ein bis drei Monate festgelegt. Eine zeitliche Unterbrechung, und damit eine Aufteilung der Pflegekarenz oder Pflegeteilzeit, ist nicht zulässig."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "short-right"
    text_de: "In Betrieben mit mehr als fünf Beschäftigten gibt es einen Rechtsanspruch auf zunächst zwei Wochen."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Arbeitnehmerinnen und Arbeitnehmer haben ab 1. Jänner 2020 einen Rechtsanspruch auf zwei Wochen Pflegekarenz/Pflegeteilzeit."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "company-size"
    text_de: "Der gesetzliche Kurzanspruch gilt in Betrieben mit mehr als fünf Beschäftigten. Kleinere Betriebe: Vereinbarung oder Betriebsvereinbarung klären."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Der Rechtsanspruch gilt in Betrieben mit mehr als fünf Arbeitsnehmerinnen und Arbeitnehmern."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "extension"
    text_de: "Kommt in den ersten zwei Wochen keine längere Vereinbarung zustande, sind bis zu zwei weitere Wochen möglich; insgesamt bis zu vier Wochen."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Kommt währenddessen keine Vereinbarung über eine Pflegekarenz/Pflegeteilzeit zustande, so besteht ein Anspruch auf Pflegekarenz/Pflegeteilzeit für bis zu weiteren zwei Wochen (insgesamt vier Wochen)."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "pay"
    text_de: "Bei Pflegekarenz entfällt der Lohn, bei Pflegeteilzeit sinkt er anteilig. Pflegekarenzgeld bitte gesondert beantragen. Das SMS ist Anlaufstelle für dieses Geld; die Arbeitspause vereinbaren Sie mit dem Arbeitgeber."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Bei der Pflegekarenz entfällt das Arbeitsentgelt gänzlich, bei der Pflegeteilzeit nur aliquot."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "remaining-hours"
    text_de: "Bei Pflegeteilzeit bleiben mindestens zehn Wochenstunden Normalarbeitszeit."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Die wöchentliche Normalarbeitszeit darf bei der Pflegeteilzeit nicht unter zehn Stunden liegen."
      retrieved_at: "2026-11-06T00:06:59Z"
    condition: "weekly_hours >= 10"
    legal_basis: "§§ 14c–14d AVRAG; Pflegekarenzgeld: § 21c BPGG (SozDok, in Kraft seit 01.11.2023)"
office_rules:
  - when: "true"
    office: "ref:offices/sms-steiermark"
documents:
  - id: "agreement"
    name_de: "Schriftliche Vereinbarung oder Nachweis des gesetzlichen Rechtsanspruchs"
    required: true
    obtain_from: "Arbeitgeber; den eigenen Nachweis der Verständigung aufbewahren."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Voraussetzung für den Antritt einer Pflegekarenz oder einer Pflegeteilzeit ist eine schriftliche Vereinbarung zwischen Arbeitnehmerinnen- bzw. Arbeitnehmer- und Arbeitgeberinnen- bzw. Arbeitgeberseite. Diese Vereinbarung kann getroffen werden, wenn das Arbeitsverhältnis seit ununterbrochen zumindest drei Monaten besteht."
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "care-level"
    name_de: "Pflegegeldbescheid der nahestehenden Person"
    required: true
    obtain_from: "Unterlagen der betroffenen Person oder auszahlender Pflegegeldträger."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "nahe Angehörige, denen zum Zeitpunkt des Antritts Pflegegeld ab Stufe 3 nach dem Bundespflegegeldgesetz (BPGG) mit Bescheid zuerkannt wurde."
      retrieved_at: "2026-11-06T00:06:59Z"
