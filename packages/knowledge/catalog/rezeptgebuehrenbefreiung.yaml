id: rezeptgebuehrenbefreiung
name_de: Rezeptgebührenbefreiung
name_simple: Keine Rezeptgebühr zahlen
area: E
life_situations: [geringes-einkommen]
scope: social_insurance
carriers: [oegk, svs, bvaeb]
criteria:
  - id: standard-income
    text_de: >-
      Richtsätze 2026 für die Befreiung auf Antrag: monatliches Nettoeinkommen
      bis 1.308,39 Euro für Alleinstehende und bis 2.064,12 Euro für Paare.
      Die Haushaltsberechnung und Zuschläge prüft der zuständige Träger.
      Für aktiv erwerbstätige SVS-Bäuerinnen und Bauern gelten Einheitswertgrenzen.
    source: &income
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: >-
        Wenn Ihr monatliches Nettoeinkommen folgende Richtsätze nicht übersteigt,
        können Sie einen Antrag auf Befreiung von der Rezeptgebühr stellen:
        Alleinstehende: EUR 1.308,39 Ehepaare: EUR 2.064,12
      retrieved_at: 2026-11-05T23:49:35Z
  - id: documented-additional-expenses
    text_de: >-
      Bei nachgewiesenem erhöhtem Medikamentenbedarf gelten 2026 die erhöhten
      Richtsätze von 1.504,65 Euro für Alleinstehende und 2.373,74 Euro für Paare.
      Der Träger prüft die Nachweise; aus Symptomen oder Befunden wird kein Bedarf abgeleitet.
    source: &higher-income
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: >-
        Wenn Sie einen erhöhten Bedarf an Medikamenten aufgrund einer Krankheit
        oder eines Gebrechens haben, gelten folgende Richtsätze für Sie:
        Alleinstehende: EUR 1.504,65 Ehepaare: EUR 2.373,74
        Die Richtsätze für Ehepaare gelten auch für Lebensgemeinschaften und eingetragene Partnerschaften.
      retrieved_at: 2026-11-05T23:49:35Z
  - id: household-income
    text_de: >-
      Bei der ÖGK zählen das eigene Einkommen und das Einkommen der Partnerperson
      zu 100 Prozent, Einkommen anderer Haushaltsmitglieder zu 12,5 Prozent.
      Pro Kind erhöht sich der Richtsatz um 201,88 Euro, wenn dessen Nettoeinkommen
      unter 481,23 Euro liegt. Für Kinder über 18 prüft die ÖGK weitere Voraussetzungen.
    source: &household
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: >-
        Für jedes Kind erhöht sich der Richtsatz um EUR 201,88, sofern das
        Nettoeinkommen des Kindes den Grenzbetrag von EUR 481,23 nicht erreicht.
        Für Kinder über 18 werden weitere Voraussetzungen geprüft.
        Wir berücksichtigen dabei Ihr Einkommen und das Ihrer Partnerin bzw.
        Ihres Partners zu 100 Prozent. Das Einkommen aller anderen Personen,
        die im selben Haushalt leben, rechnen wir mit 12,5 Prozent an.
      retrieved_at: 2026-11-05T23:49:35Z
  - id: svs-agriculture
    text_de: >-
      Für aktiv erwerbstätige SVS-Bäuerinnen und Bauern ist eine Befreiung wegen
      geringen Einkommens auf Antrag bei einem Einheitswert bis 6.800 Euro
      (alleinstehend) bzw. 10.800 Euro (verheiratet oder in eingetragener Partnerschaft)
      möglich. Weitere Belastungsfälle prüft die SVS gesondert.
    source: &agriculture
      url: https://www.svs.at/cdscontent/?contentid=10007.816812&portal=svsportal
      quote: >-
        Auf Antrag ist eine Rezeptgebührenbefreiung bei der SVS für aktiv
        erwerbstätige Versicherte wegen geringen Einkommens möglich, wenn der
        Einheitswert des land(forst)wirtschaftlichen Betriebes EUR 6.800,00
        (bei alleinstehenden Betriebsführer/innen) bzw. EUR 10.800,00
        (bei verheirateten bzw. in eingetragener Partnerschaft lebenden
        Betriebsführer/innen) nicht übersteigt.
      retrieved_at: 2026-11-05T23:49:35Z
  - id: bvaeb-income
    text_de: >-
      Auch die BVAEB veröffentlicht 2026 die Richtsätze von 1.308,39 Euro
      für Alleinstehende und 2.064,12 Euro für Ehepaare oder eingetragene
      Partnerschaften sowie eine Erhöhung um 201,88 Euro pro mitversichertem Kind.
      Die BVAEB prüft die familiären Verhältnisse und weitere Befreiungsgründe.
    source: &bvaeb
      url: https://www.bvaeb.at/cdscontent/?contentid=10007.840469&portal=bvaebbportal&viewmode=content
      quote: >-
        Alleinstehende bis zu einem Nettoeinkommen von EUR 1.308,39
        Ehepaare/eingetr. Partner bis zu einem Nettoeinkommen von EUR 2.064,12
        für jedes mitversicherte Kind erhöht sich der Richtsatz um EUR 201,88
      retrieved_at: 2026-11-05T23:49:35Z
  - id: automatic-exemption
    text_de: >-
      Bei der ÖGK sind unter anderem Personen mit Ausgleichszulage und Personen,
      die durch den Sozialhilfebezug krankenversichert sind, automatisch befreit.
      Vor einem Antrag den bestehenden Befreiungsstatus beim Träger klären.
    source: &automatic
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: >-
        Folgende Personengruppen sind automatisch von der Rezeptgebühr befreit:
        Bezieherinnen und Bezieher einer Ausgleichszulage oder eines
        Ausgleichszulagenbonus bzw. Pensionsbonus Zivildiener
        Bezieherinnen und Bezieher von Sozialhilfe, die aufgrund des Bezugs
        von Sozialhilfe krankenversichert sind
      retrieved_at: 2026-11-05T23:49:35Z
  - id: annual-fee-cap
    text_de: >-
      Nach Erreichen der Zwei-Prozent-Grenze des Jahresnettoeinkommens erfolgt
      die Befreiung für den Rest des Kalenderjahres automatisch, ohne Antrag.
      Zusätzlich ist eine Mindestobergrenze zu beachten. Maßgeblich ist der
      vom Träger bestätigte Stand des Rezeptgebührenkontos; der Lotse berechnet
      keine Befreiung aus einer Zahl von Packungen.
    source: &annual-cap
      url: https://www.oesterreich.gv.at/de/themen/hilfe_und_finanzielle_unterstuetzung_erhalten/armut-in-oesterreich/Seite.1693902
      quote: >-
        Es besteht eine Deckelung der Rezeptgebühren: Wer im laufenden
        Kalenderjahr bereits zwei Prozent des Jahresnettoeinkommens für
        Rezeptgebühren bezahlt hat, ist automatisch für den Rest des Jahres
        von der Rezeptgebühr befreit. Ein Antrag ist nicht erforderlich.
      retrieved_at: 2026-11-05T23:49:35Z
