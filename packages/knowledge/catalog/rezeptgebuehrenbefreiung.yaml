documents:
  - id: household-income-evidence
    name_de: Aktuelle Einkommensbelege aller Personen im gemeinsamen Haushalt
    required: true
    obtain_from: >-
      Je nach Einkommensart bei Arbeitgeber, pensionsauszahlendem Träger, AMS,
      Sozialhilfebehörde oder dem sonstigen Leistungsträger anfordern.
    source: &income-documents
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: >-
        Einkommensbelege von allen im gemeinsamen Haushalt lebenden Personen
        (z.B. Gehaltszettel, Pensionsbescheid, Firmenpension, Auslandsrente,
        Unfallrente, Arbeitslosengeld, Sozialhilfe)
      retrieved_at: 2026-11-05T23:49:35Z
  - id: maintenance-evidence
    name_de: Unterhaltsbelege und gegebenenfalls Scheidungsunterlagen
    required: false
    obtain_from: Eigene Zahlungsbelege bzw. Ausfertigungen beim zuständigen Gericht anfordern.
    source: &maintenance
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: Belege über den Bezug von Unterhalt Gerichtsbeschluss und Vergleichsausfertigung einer Scheidung
      retrieved_at: 2026-11-05T23:49:35Z
  - id: documented-medication-list
    name_de: Ärztliche Medikamentenliste, nur wenn für den Befreiungsgrund erforderlich
    required: false
    obtain_from: Bei der behandelnden Ärztin oder beim behandelnden Arzt anfordern.
    source: &medication-list
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.870471&portal=oegkportal
      quote: Medikamentenliste von der Ärztin oder dem Arzt (nur bei Zutreffen der Befreiungsgründe)
      retrieved_at: 2026-11-05T23:49:35Z
