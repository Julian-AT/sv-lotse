documents:
  - id: verordnung
    name_de: Verordnung für den benötigten Heilbehelf oder das Hilfsmittel
    required: true
    obtain_from: >-
      Verordnende Ärztin oder verordnender Arzt; bei der ÖGK in den zugelassenen
      pflegespezifischen Bereichen auch entsprechend fortgebildete DGKP.
    source: *prescription
  - id: kostenvoranschlag
    name_de: Kostenvoranschlag bei nicht tariflich geregelten Produkten
    required: false
    obtain_from: Fachbetrieb; bei fehlender Tarifvereinbarung mit dem Träger vor dem Bezug klären.
    source: &estimate
      url: https://www.bvaeb.at/cdscontent/?contentid=10007.840378&portal=bvaebbportal
      quote: >-
        Für die Bewilligung eines solchen Produktes benötigen wir eine ärztliche
        Verordnung und einen detaillierten Kostenvoranschlag.
      retrieved_at: 2026-11-05T23:49:33Z
  - id: bewilligung
    name_de: Bewilligung, wenn für das verordnete Produkt erforderlich
    required: false
    obtain_from: Zuständiger Krankenversicherungsträger, üblicherweise über den Vertragspartner.
    source: *bvaeb-approval
  - id: bezahlte-rechnung
    name_de: Rechnung und Zahlungsbestätigung bei Bezug ohne Vertragspartner
    required: false
    obtain_from: Abgebender Fachbetrieb; Zahlungsbestätigung vom Fachbetrieb oder eigener Zahlungsnachweis.
    source: *svs-partner
