  - when: contact_region == "Salzburg"
    office: ref:offices/oegk-salzburg
  - when: contact_region == "Tirol"
    office: ref:offices/oegk-tirol
  - when: contact_region == "Vorarlberg"
    office: ref:offices/oegk-vorarlberg
documents:
  - id: sick-note
    name_de: Ärztliche Krankmeldung
    required: true
    obtain_from: Behandelnde Ärztin oder behandelnder Arzt
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
      quote:
        "Um Ihnen das Krankengeld auszahlen zu können, benötigen wir von Ihnen folgende Unterlagen: y
        Krankmeldung y Eine „Arbeits- und Entgeltbestätigung”, die Angaben über die Einkommenshöhe
        und die Dauer einer eventuellen Entgeltfortzahlung enthält. Diese wird von der Dienstgeberin
        bzw. dem Dienstgeber ausgestellt."
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: earnings
    name_de: Arbeits- und Entgeltbestätigung bei Beschäftigung
    required: false
    obtain_from: Arbeitgeber; bei AMS-Bezug übermittelt das AMS die Daten elektronisch
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
      quote:
        "Um Ihnen das Krankengeld auszahlen zu können, benötigen wir von Ihnen folgende Unterlagen: y
