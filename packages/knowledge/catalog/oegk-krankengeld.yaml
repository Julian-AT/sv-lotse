        und die Dauer einer eventuellen Entgeltfortzahlung enthält. Diese wird von der Dienstgeberin
        bzw. dem Dienstgeber ausgestellt."
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: bank-details
    name_de: Eigene Bankverbindung
    required: true
    obtain_from: Eigene Konto-Unterlagen
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
      quote: Vergessen Sie bitte auch nicht, uns Ihre Bankverbindung bekanntzugeben.
      retrieved_at: 2026-11-06T00:07:42.653242Z
