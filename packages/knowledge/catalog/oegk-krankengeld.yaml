id: oegk-krankengeld
name_de: Krankengeld
name_simple: Geld im Krankenstand erhalten
area: C
life_situations:
  - oegk-krankengeld-navigation
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: earnings
    text_de: Krankengeld ersetzt entfallenden Arbeitsverdienst unter Berücksichtigung der
      Entgeltfortzahlung. Bei halbem Lohnanspruch wird halbes Krankengeld geleistet.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
      quote: "Dabei gilt: Halber Lohn-/Gehaltsanspruch bedeutet halbes Krankengeld."
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: notification
    text_de: Der Anspruch ruht, solange die Arbeitsunfähigkeit der ÖGK nicht gemeldet ist.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=29
      quote:
        wenn und solange die Arbeitsunfähigkeit der ÖGK nicht gemeldet wird. Das wird in der Regel
        von der Ärztin bzw. vom Arzt für Sie erledigt.
      retrieved_at: 2026-11-06T00:07:42.653242Z
    condition: sick_note_reported == true
