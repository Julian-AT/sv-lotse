id: praevention-oeffentliches-impfprogramm
name_de: Öffentliches Impfprogramm – Influenza und Impfpassübersicht
name_simple: Impfangebote finden und dokumentierte Impfeinträge ansehen
area: A
life_situations:
  - prevention
scope: federal
criteria:
  - id: published-access
    text_de: Der Zugang zur Influenza-Impfung im öffentlichen Programm ist
      kostenlos. Verfügbarkeit bei der Impfstelle prüfen. Hier werden
      ausschließlich bestätigte dokumentierte Impfeinträge gezeigt.
      Impfstoffwahl und persönliche Termine entscheidet die behandelnde Ärztin
      oder der behandelnde Arzt.
    source: &a1
      url: https://impfen.gv.at/impfungen/influenza
      quote: Die Influenza-Impfung ist im Rahmen des öffentlichen Impfprogramms von
        Bund, Länder und Sozialversicherung für alle gratis.
      retrieved_at: 2026-11-06T01:36:22Z
