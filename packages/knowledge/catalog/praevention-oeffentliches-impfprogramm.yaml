      quote: "Man kommt mit der e-card oder einem Ausweis zur Impfung."
      retrieved_at: "2026-11-06T03:45:00Z"
  - id: paper-vaccination-pass
    name_de: "Gelber Papierimpfpass, um frühere Impfungen nachtragen zu lassen"
    required: false
    obtain_from: "Eigene Unterlagen"
    source: &doc2
