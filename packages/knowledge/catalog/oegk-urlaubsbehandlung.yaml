id: oegk-urlaubsbehandlung
name_de: Ärztliche Behandlung im Urlaub
name_simple: Krankenversicherung im Urlaub klären
area: C
life_situations:
  - oegk-urlaubsbehandlung-navigation
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: contract-abroad
    text_de: Die EKVK gilt für medizinisch notwendige Sachleistungen bei abrechnungsberechtigten
      Vertragspartnern im Ausland; länderspezifische Regeln beachten.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=21
      quote:
        Mit der EKVK bekommen Sie direkt bei Vertragspartnerinnen und Vertragspartnern im Ausland
        medizinisch notwendige Sachleistungen. Legen Sie dafür die EKVK den Leistungserbringern
        (Ärztin oder Arzt, Krankenanstalt usw.) vor.
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: copayment
    text_de: Selbstbehalte nach den Vorschriften des Behandlungsstaats sind selbst zu bezahlen.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=21
      quote: Sie müssen Selbstbehalte nach den Rechtsvorschriften des Behandlungsstaats selbst bezahlen.
      retrieved_at: 2026-11-06T00:07:42.653242Z
