documents:
  - id: paper-pass
    name_de: Eltern-Kind-Pass und Zusatzheft für neue Leistungen ab Oktober 2026
    required: false
    obtain_from: Betreuende Ärztin oder betreuender Arzt; neue Leistungen werden im Zusatzheft dokumentiert.
    source:
      url: https://www.sozialministerium.gv.at/Themen/Gesundheit/Eltern-und-Kind/Eltern-Kind-Pass.html
      quote: Für die Dokumentation der neuen und zusätzlichen Untersuchungen erhalten Sie, bis zur
        Umstellung auf den elektronischen Eltern-Kind-Pass (verpflichtende Einführung ab Oktober
        2027), von Ihrem betreuenden medizinischen Fachpersonal ein Zusatzheft
      retrieved_at: 2026-11-05T23:55:25.869Z
  - id: examination-proofs
    name_de: Bestätigungen der Eltern-Kind-Pass-Untersuchungen
    required: false
    obtain_from: Ärztin oder Arzt bestätigt die Untersuchungen. Bei Papiernachweisen Kopien für die
      Krankenkasse machen; Originale im Pass lassen.
    source:
      url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/finanzielle-unterstuetzungen/3/2/Seite.080625
      quote:
        Fertigen Sie eine Kopie der Nach­weisblätter an, aber belassen Sie die Originalblätter im
        Eltern-Kind-Pass.
      retrieved_at: 2026-11-05T23:52:44.349Z
forms:
  - search: Eltern-Kind-Pass Nachweisblätter für Kinderbetreuungsgeld
    publisher: Bundesministerium für Arbeit, Soziales, Gesundheit, Pflege und Konsumentenschutz
process: ref:processes/familie-eltern-kind-pass
