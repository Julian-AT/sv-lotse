# Awaiting human review; sources checked for WP-159.
id: familie-eltern-kind-pass
name_de: Eltern-Kind-Pass
name_simple: Untersuchungen in der Schwangerschaft und für Ihr Kind
area: A
life_situations:
  - familie-mit-kind
scope: federal
carriers:
  - oegk
  - svs
  - bvaeb
criteria:
  - id: pass-issuance
    text_de:
      Nach ärztlich festgestellter Schwangerschaft erhalten Schwangere mit Wohnsitz in Österreich
      den Eltern-Kind-Pass bei ihrer Ärztin oder ihrem Arzt.
    condition: pregnancy_confirmed == true and residence_austria == true
    legal_basis: Eltern-Kind-Pass-Programm des Gesundheitsministeriums; § 7 Abs. 1 KBGG (SozDok, in
      Kraft seit 2026-10-01)
    source:
      url: https://www.sozialministerium.gv.at/Themen/Gesundheit/Eltern-und-Kind/Eltern-Kind-Pass.html
      quote:
        Nach Feststellen einer Schwangerschaft erhält jede Schwangere mit Wohnsitz in Österreich von
        Ihrem betreuenden Arzt/Ihrer betreuenden Ärztin einen Eltern-Kind-Pass.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: programme-2026
    text_de: Seit 1. Oktober 2026 gilt das neue Programm auch für bestehende Papierpässe. Bereits
      erfolgte Untersuchungen werden nicht allein wegen der Umstellung wiederholt.
    legal_basis: Eltern-Kind-Pass-Untersuchungsprogramm ab 1. Oktober 2026 (Gesundheitsministerium)
    source:
      url: https://www.sozialministerium.gv.at/Themen/Gesundheit/Eltern-und-Kind/Eltern-Kind-Pass.html
      quote:
        Das neue Untersuchungsprogramm gilt ab 01.10.2026 in ganz Österreich und somit auch für einen
        bereits ausgestellten Papierpass.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: full-payment
    text_de:
      Für das volle Kinderbetreuungsgeld sind fünf Schwangerschaftsuntersuchungen und die ersten
      fünf Kindesuntersuchungen vorgesehen. Es geht um den Nachweis, nicht um die Bewertung der
      Ergebnisse.
    legal_basis: § 7 KBGG und § 24c KBGG (SozDok, in Kraft seit 2026-10-01;
      KBGG=PARA=7=115_82=2025-12-30=2026-10-01; KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)
    source:
      url: https://www.sozialministerium.gv.at/Themen/Gesundheit/Eltern-und-Kind/Eltern-Kind-Pass.html
      quote:
        Die Durchführung der Schwangerenuntersuchungen 1-5 sowie die Kindesuntersuchungen 1-5 (bis
        zum 14. Lebensmonat des Kindes) ist Voraussetzung für den Erhalt des Kinderbetreuungsgeldes
        in voller Höhe.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: initial-proof
    text_de: Für das volle Kinderbetreuungsgeld sind bei der Antragstellung die fünf
      Schwangerschaftsuntersuchungen und die erste Kindesuntersuchung nachzuweisen.
    legal_basis: § 7 KBGG und § 24c KBGG (SozDok, in Kraft seit 2026-10-01;
      KBGG=PARA=7=115_82=2025-12-30=2026-10-01; KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)
    source:
      url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/finanzielle-unterstuetzungen/3/2/Seite.080625
      quote: Bei der Antragstellung müssen die fünf Schwangerschaftsuntersuchungen und die erste
        Untersuchung des Kindes (in Kopie) nachgewiesen werden.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: later-proof
    text_de: Die Kindesuntersuchungen 2 bis 5 erfolgen bis zur Vollendung des 14. Lebensmonats. Der
      Nachweis erfolgt spätestens bis zur Vollendung des 15. Lebensmonats.
    legal_basis: § 7 KBGG und § 24c KBGG (SozDok, in Kraft seit 2026-10-01;
      KBGG=PARA=7=115_82=2025-12-30=2026-10-01; KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)
    source:
      url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/finanzielle-unterstuetzungen/3/2/Seite.080625
      quote:
        Die restlichen Untersuchungen müssen bis zum 15. Lebensmonat des Kindes (ebenfalls in Kopie)
        nachgewiesen werden.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: electronic-proof
    text_de: Nach erfolgreichem elektronischem Nachweis durch den eEKP sind keine weiteren Nachweise
      nötig, solange die Krankenkasse nichts anderes mitteilt.
    legal_basis: § 7 KBGG und § 24c KBGG (SozDok, in Kraft seit 2026-10-01;
      KBGG=PARA=7=115_82=2025-12-30=2026-10-01; KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)
    source:
      url: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20001474
      quote:
        In jenen Fällen, in denen die Nachweise erfolgreich elektronisch durch den eEKP gemäß § 6
        Abs. 2 EKPG erfolgt sind, entfällt die Nachweispflicht der antragstellenden Elternteile,
        sofern seitens des Krankenversicherungsträgers keine gegenteilige Information ergeht.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: late-proof
    text_de:
      "Bei verspätetem Nachweis die Krankenkasse fragen: Die Nachweise können bis spätestens zur
      Vollendung des 18. Lebensmonats nachgebracht werden."
    legal_basis: § 7 KBGG und § 24c KBGG (SozDok, in Kraft seit 2026-10-01;
      KBGG=PARA=7=115_82=2025-12-30=2026-10-01; KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)
    source:
      url: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20001474
      quote: die jeweiligen Nachweise bis spätestens zur Vollendung des 18. Lebensmonates des Kindes
        nachgebracht werden.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: reduction
    text_de: Fehlt ein rechtzeitiger Nachweis, werden grundsätzlich 1.300 Euro pro beziehendem
      Elternteil abgezogen. Ausnahmen und Nachreichung sind mit der Krankenkasse zu klären.
    legal_basis:
      "§ 3 Abs. 4 und § 24a Abs. 4 KBGG; Nachweise: § 7 KBGG und § 24c KBGG (SozDok, in Kraft
      seit 2026-10-01; KBGG=PARA=7=115_82=2025-12-30=2026-10-01;
      KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)"
    source:
      url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/finanzielle-unterstuetzungen/3/2/Seite.080625
      quote:
        Wenn beide Elternteile Kinderbetreuungsgeld beziehen, erfolgt der Abzug von 1.300 Euro bei
        jedem der Elternteile.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: unavoidable-missing-proof
    text_de: Wurden Untersuchungen aus Gründen, die die Eltern nicht zu vertreten haben, nicht
      durchgeführt oder nicht nachgewiesen, kann trotzdem Anspruch auf die volle Höhe bestehen. Die
      Krankenkasse prüft das.
    legal_basis: § 7 KBGG und § 24c KBGG (SozDok, in Kraft seit 2026-10-01;
      KBGG=PARA=7=115_82=2025-12-30=2026-10-01; KBGG=PARA=24c=115_115_82=2025-12-30=2026-10-01)
    source:
      url: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20001474
      quote:
        die Vornahme oder der Nachweis der Untersuchungen nur aus Gründen, die nicht von den Eltern
        zu vertreten sind, unterbleibt oder
      retrieved_at: 2026-11-05T23:54:09.967Z
