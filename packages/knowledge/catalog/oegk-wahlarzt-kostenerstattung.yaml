documents:
  - id: invoice
    name_de: Detaillierte Honorarnote mit Zahlungsbestätigung
    required: true
    obtain_from: Wahlärztin oder Wahlarzt; Zahlungsnachweis von der eigenen Bank oder als Quittung
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=18
      quote:
        Die Honorarnote muss Vor- und Familiennamen der bzw. des Versicherten, Versicherungsnummer,
        Wohnadresse, Zahlungsbestätigung, das Ausstellungsdatum und genaue Angaben über die
        ärztlichen Leistungen samt Datum enthalten.
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: payment-proof
    name_de: Zahlungsnachweis (Zahlungsvermerk auf der Honorarnote, Einzahlungsabschnitt oder
      Nachweis der Abbuchung)
    required: true
    obtain_from: Wahlärztin oder Wahlarzt für den Zahlungsvermerk; eigene Bank für Bank- oder
      Protokollauszug
    source: &payment-proof
      url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
      quote: >-
        Zahlungsnachweis bei Barzahlung: Zahlungsvermerk auf der Honorarnote bei Zahlung mit
        Erlagschein: Einzahlungsabschnitt (auch Kopie) bei elektronischer Bezahlung: Nachweis der
        Abbuchung (z.B. Protokollauszug, Bankauszug)
      retrieved_at: 2026-11-06T03:45:00Z
  - id: referral
    name_de: Überweisung oder Zuweisung, wenn sie für die Leistung erforderlich ist (zum Beispiel
      Röntgen, CT oder MRT)
    required: false
    obtain_from: Behandelnde Ärztin oder behandelnder Arzt
    source: &referral
      url: https://www.oegk.at/cdscontent/?contentid=10007.870526&portal=oegkportal
      quote:
        Für die Untersuchung benötigen Sie eine Zuweisung von Ihrer behandelnden Ärztin oder dem
        behandelnden Arzt. Diese Zuweisung ist ab dem Ausstellungstag drei Monate gültig.
      retrieved_at: 2026-11-06T03:45:00Z
  - id: bank-details
    name_de: Bankverbindung (IBAN und BIC) für die Auszahlung
    required: true
    obtain_from: Eigene Bank; die Angabe machen Sie selbst beim Einreichen
    source: &bank-details
      url: https://www.oegk.at/cdscontent/?contentid=10007.870516&portal=oegkportal
      quote: Geben Sie dort Ihre Bankverbindung an (IBAN und BIC).
      retrieved_at: 2026-11-06T03:45:00Z
