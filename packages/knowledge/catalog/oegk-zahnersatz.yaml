# Medizinische Sonderfälle nur von Zahnmedizin und ÖGK prüfen lassen. Keine Auswahl oder Empfehlung eines Zahnersatzes.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
id: oegk-zahnersatz
name_de: Zahnersatz
name_simple: Kosten für Zahnersatz klären
area: C
life_situations:
  - illness
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: prior-approval
    text_de: Abnehmbaren Zahnersatz vor Behandlungsbeginn durch die ÖGK genehmigen lassen.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=41
      quote:
        Für die Anfertigung eines Zahnersatzes stellt Ihnen Ihre behandelnde Vertragszahnärztin bzw.
        Ihr behandelnder Vertragszahnarzt (Vertragseinrichtung) das Formular „Antrag auf
        Kostenübernahme für Zahnersatz” aus. Vor Beginn der Behandlung müssen Sie eine Genehmigung
        bei der ÖGK einholen.
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: fixed-private
    text_de:
      Festsitzender Zahnersatz ist grundsätzlich privat zu bezahlen. Zuschuss nur in medizinisch
      begründeten Sonderfällen mit vorheriger Bewilligung.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=41
      quote:
        In medizinisch begründeten Sonderfällen wird ein Zuschuss geleistet, wenn vor der Behandlung
        die Bewilligung durch den Zahnmedizinischen Dienst der ÖGK eingeholt wurde.
      retrieved_at: 2026-11-06T00:07:42.653242Z
