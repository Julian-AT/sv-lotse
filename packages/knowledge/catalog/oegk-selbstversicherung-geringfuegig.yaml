# Zuständigkeit nach Beschäftigungsbundesland, nicht Wohnort. Dienstleistungsscheck und Auslandswohnsitz sind Sonderfälle; reguläre Grenze ist keine abschließende Anspruchsprüfung.
# Keine erfundenen Terminangebote: appointment_channels bleibt bis zur menschlichen Prüfung leer.
id: oegk-selbstversicherung-geringfuegig
name_de: Selbstversicherung bei geringfügiger Beschäftigung
name_simple: Mit einem kleinen Job versichert sein
area: C
life_situations:
  - oegk-selbstversicherung-geringfuegig-navigation
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: minor-employment
    text_de:
      "Geringfügige Beschäftigung ohne Pflichtversicherung in Kranken- oder Pensionsversicherung;
      reguläre Entgeltgrenze 2026: 551,10 Euro monatlich."
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
      quote: Die Voraussetzungen sind, dass Sie nur geringfügig beschäftigt sind und noch keine
        Pflichtversicherung in der Kranken- und/oder Pensionsversicherung haben. Das Entgelt, das
        Sie erhalten, darf die jeweils gültige Geringfügigkeitsgrenze nicht übersteigen. Die
        Geringfügigkeitsgrenze liegt im Jahr 2026 bei 551,10 Euro.
      retrieved_at: 2026-11-06T00:07:42.653242Z
    condition: minor_employment == true and compulsory_cover == false and monthly_income <= 551.10
    legal_basis: § 19a ASVG (SozDok)
  - id: contribution
    text_de: "Monatsbeitrag 2026: 83,49 Euro. Der PDF-Regelfall beschreibt einen Wohnsitz im Inland;
      Auslandswohnsitz und Dienstleistungsscheck gesondert bei der ÖGK prüfen."
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
      quote: Geringfügig Beschäftigte mit Wohnsitz im Inland können sich in der Kranken- und
        Pensionsversicherung zu einem monatlichen Beitrag von derzeit 83,49 Euro selbst versichern.
        Das ist die „Selbstversicherung in der Kranken- und Pensionsversicherung nach § 19a ASVG”.
      retrieved_at: 2026-11-06T00:07:42.653242Z
