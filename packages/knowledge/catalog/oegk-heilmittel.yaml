id: oegk-heilmittel
name_de: Heilmittel auf ärztliches Rezept
name_simple: Ein Rezept bei der Apotheke einlösen
area: C
life_situations:
  - illness
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: prescription
    text_de: Ärztlich verschriebene Heilmittel werden auf Rezept in einer öffentlichen Apotheke oder
      Hausapotheke eingelöst.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=22
      quote: Diese verschreibt Ihnen Ihre Ärztin bzw. Ihr Arzt und speichert das e-Rezept im
        e-card-System. Das Rezept können Sie in jeder öffentlichen Apotheke oder Hausapotheke auf
        Kosten der ÖGK einlösen.
      retrieved_at: 2026-11-06T00:07:42.653242Z
    condition: prescription_present == true
  - id: approval
    text_de: Für bewilligungspflichtige Arzneien holt die Ärztin oder der Arzt eine Genehmigung des
      Medizinischen Dienstes der ÖGK ein.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=22
      quote:
        Darüber hinaus gibt es bewilligungspflichtige Arzneien, für die Ihre Ärztin bzw. Ihr Arzt
        eine Genehmigung des Medizinischen Dienstes der ÖGK einholt.
      retrieved_at: 2026-11-06T00:07:42.653242Z
