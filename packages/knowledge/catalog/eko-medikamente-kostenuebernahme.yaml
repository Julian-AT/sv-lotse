documents:
  - id: prescription
    name_de: Rezept (e-Rezept oder Papierrezept) mit dem genauen Produktnamen
    required: true
    obtain_from: Verordnende Ärztin oder verordnender Arzt; das e-Rezept ist im e-card-System gespeichert.
    source: &prescription
      url: https://www.oegk.at/cdscontent/?contentid=10007.870460&portal=oegkportal
      quote: Sie/Er tut dies entweder in Form eines Papierrezepts oder aber auch elektronisch.
      retrieved_at: 2026-11-06T03:45:00Z
  - id: approval
    name_de: Bewilligung des chef- und kontrollärztlichen Dienstes, nur wenn sie erforderlich ist
    required: false
    obtain_from: >-
      Holt die verordnende Ärztin oder der verordnende Arzt ein; bei einem Wahlarzt-Rezept ohne
      Rezepturrecht das Rezept per Post oder persönlich bei der Krankenkasse einreichen.
    source: *approval-by-prescriber
