# Awaiting human review. Empty booking channels do not imply an unavailable service.
id: "pflegekarenzgeld"
name_de: "Pflegekarenzgeld bei Pflegekarenz oder Pflegeteilzeit"
name_simple: "Geld während einer Pflegepause beantragen"
area: "D"
life_situations:
  - "care"
scope: "federal"
carriers: []
criteria:
  - id: "employment-or-ams"
    text_de: "Bei Beschäftigten: unmittelbar vorher mindestens drei Monate vollversichert beschäftigt. Für die Pflegekarenz ist auch ein Zugang nach Abmeldung von Arbeitslosengeld oder Notstandshilfe möglich; mit AMS und SMS klären."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Vorliegen einer Vollversicherung (Krankenversicherung, Unfallversicherung und Pensionsversicherung) aufgrund eines unmittelbar vor Inanspruchnahme der Pflegekarenz oder Pflegeteilzeit liegenden, ununterbrochenen Arbeitsverhältnisses von zumindest drei Monaten"
      retrieved_at: "2026-11-06T00:06:59Z"
    condition: "employment_months >= 3 and fully_insured == true or ams_deregistered == true"
    legal_basis: "§ 21c Abs. 1–2 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "predominant-care"
    text_de: "Sie erklären, dass Sie die Pflege und Betreuung während der Pflegekarenz oder Pflegeteilzeit überwiegend übernehmen."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/Pflegekarenz_und_-teilzeit/Pflegekarenz_und_-teilzeit.de.html"
      quote: "Erklärung der überwiegenden Pflege und Betreuung für die Dauer der Pflegekarenz oder Pflegeteilzeit"
      retrieved_at: "2026-11-06T00:06:59Z"
    condition: "predominant_care == true"
    legal_basis: "§ 21d Abs. 2 Z 4 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "no-marginal-employment"
    text_de: "Nach bloß geringfügiger Beschäftigung besteht kein Anspruch auf Pflegekarenzgeld."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Wenn vor der Inanspruchnahme der Pflegekarenz oder Pflegeteilzeit eine geringfügige Beschäftigung vorlag, ist der Bezug eines Pflegekarenzgeldes nicht möglich."
      retrieved_at: "2026-11-06T00:06:59Z"
    condition: "marginal_employment == false"
    legal_basis: "§ 21c Abs. 2 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "retroactive"
    text_de: "Bei Antrag innerhalb von zwei Monaten ab Beginn wird ab Beginn gezahlt. Bei späterem Antrag vor Ende erst ab Antragstag; nach Ende ist der Antrag verspätet."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Erfolgt die Antragstellung auf Pflegekarenzgeld innerhalb von zwei Monaten ab Beginn der Pflegekarenz, Pflegeteilzeit oder Familienhospizkarenz, so gebührt das Pflegekarenzgeld bereits ab Beginn dieser Maßnahme."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§ 21d Abs. 3 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "short-right-deadline"
    text_de: "Bei gesetzlichem Kurzanspruch ohne weitere Vereinbarung muss der Antrag bis zum Ende der Maßnahme gestellt werden, spätestens zwei Monate nach Beginn."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "In Fällen, in denen eine Pflegekarenz oder Pflegeteilzeit aufgrund eines Rechtsanspruchs in Anspruch genommen wurde und es zu keiner weiteren Vereinbarung gekommen ist, ist die Beantragung des Pflegekarenzgeldes bis zur Beendigung der Maßnahme, längstens jedoch zwei Monate nach Beginn der Maßnahme, zulässig."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§ 21d Abs. 3 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "duration"
    text_de: "Je nach Vereinbarung ein bis drei Monate pro Angehöriger oder Angehörigem. Für dieselbe gepflegte Person gelten gemeinsame Höchstgrenzen; weitere Ansprüche mit SMS klären."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Eine nahe Angehörige/ein naher Angehöriger kann bei einer Pflegekarenz oder Pflegeteilzeit – je nach vereinbarter Dauer mit der Arbeitgeberin/dem Arbeitgeber – zwischen einem und drei Monaten Pflegekarenzgeld beziehen."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§ 21c Abs. 1 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "amount"
    text_de: "Der Grundbetrag richtet sich nach dem Einkommen: grundsätzlich 55 Prozent des täglichen Nettoeinkommens, mindestens die monatliche Geringfügigkeitsgrenze. SMS berechnet den Betrag."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Der Grundbetrag des Pflegekarenzgeldes ist einkommensabhängig und gebührt in derselben Höhe wie das Arbeitslosengeld (55 Prozent des täglichen Nettoeinkommens), zumindest jedoch in Höhe der monatlichen Geringfügigkeitsgrenze ."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§ 21c Abs. 2 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "part-time"
    text_de: "Bei Pflegeteilzeit wird Pflegekarenzgeld anteilig gewährt."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Da im Falle einer Pflegeteilzeit/Familienhospizteilzeit die Arbeitszeit reduziert und das Einkommen verringert wird, gebührt das Pflegekarenzgeld aliquot."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§ 21c Abs. 1 und 3 BPGG (SozDok, in Kraft seit 01.11.2023)"
  - id: "incompatible-support"
    text_de: "Für dieselbe vereinbarte Pflegekarenz oder Pflegeteilzeit können diese Personen keine Förderung der 24-Stunden-Betreuung beziehen. Bei gleichzeitigen Anträgen klärt SMS die Zuordnung."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/Pflegekarenz_und_-teilzeit/Pflegekarenz_und_-teilzeit.de.html"
      quote: "Personen, die eine Pflegekarenz oder eine Pflegeteilzeit vereinbart haben, können für die vereinbarte Dauer auch keine Förderung einer 24-Stunden-Betreuung beziehen."
      retrieved_at: "2026-11-06T00:06:59Z"
    legal_basis: "§ 21e Abs. 7 BPGG (SozDok, in Kraft seit 01.01.2023)"
office_rules:
  - when: "true"
    office: "ref:offices/sms-steiermark"
documents:
  - id: "agreement"
    name_de: "Vereinbarung oder Nachweis der Inanspruchnahme des Rechtsanspruchs"
    required: false
    obtain_from: "Arbeitgeber oder eigene Verständigung des Arbeitgebers; für Beschäftigte erforderlich."
    source:
      url: "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsrecht/Karenz-und-Teilzeit/Pflegekarenz-und-Pflegeteilzeit.html"
      quote: "Voraussetzung für den Antritt einer Pflegekarenz oder einer Pflegeteilzeit ist eine schriftliche Vereinbarung zwischen Arbeitnehmerinnen- bzw. Arbeitnehmer- und Arbeitgeberinnen- bzw. Arbeitgeberseite. Diese Vereinbarung kann getroffen werden, wenn das Arbeitsverhältnis seit ununterbrochen zumindest drei Monaten besteht."
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "ams-proof"
    name_de: "Beim AMS-Zugang: Bestätigung der Abmeldung"
    required: false
    obtain_from: "Zuständige AMS-Geschäftsstelle."
    source:
      url: "https://www.oesterreich.gv.at/de/themen/pflege/5/1/Seite.360529"
      quote: "Abmeldung beim AMS vom Bezug des Arbeitslosengeldes und der Notstandshilfe"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "care-declaration"
    name_de: "Erklärung der überwiegenden Pflege und Betreuung"
    required: true
    obtain_from: "Eigene Erklärung im Antrag des Sozialministeriumservice."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/Pflegekarenz_und_-teilzeit/Pflegekarenz_und_-teilzeit.de.html"
      quote: "Erklärung der überwiegenden Pflege und Betreuung für die Dauer der Pflegekarenz oder Pflegeteilzeit"
      retrieved_at: "2026-11-06T00:06:59Z"
forms:
  - search: "Pflegekarenz/Pflegeteilzeit – Antrag auf Pflegekarenzgeld"
    publisher: "Sozialministeriumservice"
process: "ref:processes/pflegekarenzgeld"
