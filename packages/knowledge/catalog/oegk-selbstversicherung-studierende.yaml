id: oegk-selbstversicherung-studierende
name_de: Selbstversicherung für Studierende
name_simple: Als Student oder Studentin krankenversichert sein
area: C
life_situations:
  - uninsured
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: student-cover
    text_de:
      "Studierendenversicherung: gewöhnlicher Aufenthalt im Inland; keine Wartezeit; Beitrag 2026
      monatlich 78,84 Euro."
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
      quote:
        "Für Studierende gibt es zusätzliche Erleichterungen. Einerseits entfällt die Wartezeit,
        andererseits genügt der gewöhnliche Aufenthalt im Inland. Außerdem gilt: Der monatliche
        Beitrag beträgt 78,84 Euro. Die begünstigte Studentenversicherung ist an Einkommensgrenzen
        und Studiendauer gebunden."
      retrieved_at: 2026-11-06T00:07:42.653242Z
    condition: domestic_stay == true
    legal_basis: § 16 ASVG (SozDok)
  - id: study-limits
    text_de:
      Die begünstigte Versicherung ist an Einkommensgrenzen und Studiendauer gebunden. Die ÖGK
      prüft diese Voraussetzungen.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
      quote:
        "Für Studierende gibt es zusätzliche Erleichterungen. Einerseits entfällt die Wartezeit,
        andererseits genügt der gewöhnliche Aufenthalt im Inland. Außerdem gilt: Der monatliche
        Beitrag beträgt 78,84 Euro. Die begünstigte Studentenversicherung ist an Einkommensgrenzen
        und Studiendauer gebunden."
      retrieved_at: 2026-11-06T00:07:42.653242Z
