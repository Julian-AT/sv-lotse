  - when: contact_region == "Vorarlberg"
    office: ref:offices/oegk-vorarlberg
documents:
  - id: application
    name_de: Ausgefüllter und unterschriebener Antrag
    required: true
    obtain_from: Formular der ÖGK; selbst ausfüllen und unterschreiben
    source:
      url: https://www.oegk.at/cdscontent/?contentid=10007.867315&portal=oegkportal
      quote:
        "Für die Anmeldung der Selbstversicherung in der Krankenversicherung benötigen wir folgende
        Dokumente: vollständig ausgefülltes und unterschriebenes Antragsformular Lichtbildausweis
        Meldebestätigung"
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: identity
    name_de: Lichtbildausweis
    required: true
    obtain_from: Eigene Ausweis-Unterlagen; ausstellende Behörde
    source:
      url: https://www.oegk.at/cdscontent/?contentid=10007.867315&portal=oegkportal
      quote:
        "Für die Anmeldung der Selbstversicherung in der Krankenversicherung benötigen wir folgende
        Dokumente: vollständig ausgefülltes und unterschriebenes Antragsformular Lichtbildausweis
        Meldebestätigung"
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: residence
    name_de: Meldebestätigung
    required: true
    obtain_from: Meldebehörde
    source:
      url: https://www.oegk.at/cdscontent/?contentid=10007.867315&portal=oegkportal
      quote:
        "Für die Anmeldung der Selbstversicherung in der Krankenversicherung benötigen wir folgende
        Dokumente: vollständig ausgefülltes und unterschriebenes Antragsformular Lichtbildausweis
        Meldebestätigung"
      retrieved_at: 2026-11-06T00:07:42.653242Z
  - id: income
    name_de: Einkommensnachweise für eine beantragte Herabsetzung
    required: false
    obtain_from: Arbeitgeber, Pensionsstelle oder auszahlende Stelle
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=11
      quote:
        Sie können einen Antrag auf Herabsetzung der Beitragsgrundlage stellen. Legen Sie dem Antrag
        sämtliche Einkommensnachweise bei.
      retrieved_at: 2026-11-06T00:07:42.653242Z
