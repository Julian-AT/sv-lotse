documents:
  - id: "care-proof"
    name_de: "Nachweis über Pflegegeld"
    required: true
    obtain_from: "Eigene Unterlagen oder auszahlender Pflegegeldträger."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Nachweis über Pflegegeld"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "care-report"
    name_de: "Bei Stufe 3 oder 4: letztes Pflegegeldgutachten, wenn möglich"
    required: false
    obtain_from: "Bei der Stelle anfordern, die über das Pflegegeld entschieden hat."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Bei Bezug eines Pflegegeldes der Stufen 3 und 4: Das zuletzt erstellte Pflegegeldgutachten (wenn möglich)"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "income"
    name_de: "Einkommensnachweise der pflegebedürftigen Person"
    required: true
    obtain_from: "Auszahlende Pensionsstelle, eigene Kontoauszüge und Steuerunterlagen."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Einkommensnachweise der pflegebedürftigen Person (Pensionsbescheid oder Kontoauszüge, letzter Einkommenssteuerbescheid, letzter Einheitswertbescheid)"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "registration"
    name_de: "Meldezettel der Betreuungskräfte"
    required: true
    obtain_from: "Betreuungskraft; zuständige Meldebehörde."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Meldezettel der Betreuungskraft/-kräfte"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "business"
    name_de: "Bei selbständiger Betreuung: Gewerbenachweis"
    required: false
    obtain_from: "Betreuungskraft; Gewerbebehörde oder Gewerberegister."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Gewerbeschein oder Gewerberegisterauszug der Betreungskraft/kräfte"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "insurance"
    name_de: "Nachweis der Vollversicherung der Betreuungskraft"
    required: true
    obtain_from: "Betreuungskraft und zuständiger Sozialversicherungsträger."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Nachweis der Vollversicherung in der Sozialversicherung"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "foreign-insurance"
    name_de: "Bei Versicherung in einem anderen EU-Staat: A1/E101-Nachweis"
    required: false
    obtain_from: "Betreuungskraft und zuständiger ausländischer Sozialversicherungsträger."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Bei einer Betreuungskraft, die in einem anderen EU-Mitgliedstaat sozialversichert ist, ein entsprechender Nachweis (insbesondere Formular A1/E101)"
      retrieved_at: "2026-11-06T00:06:59Z"
  - id: "training"
    name_de: "Ausbildungsnachweis oder Pflegeermächtigung, wenn vorhanden"
    required: false
    obtain_from: "Betreuungskraft, Ausbildungsstelle oder ausstellende Fachperson; wenn fehlend, SMS zum Hausbesuch fragen."
    source:
      url: "https://www.sozialministeriumservice.gv.at/Angehoerige/Pflege_und_Betreuung/24-Stunden-Betreuung/24-Stunden-Betreuung.de.html"
      quote: "Ausbildungsnachweis oder Pflegeermächtigung (wenn vorhanden, nach Möglichkeit übersetzt), ansonsten erfolgt Hausbesuch durch Qualitätszentrum für Pflege (SVS Bauern)"
      retrieved_at: "2026-11-06T00:06:59Z"
