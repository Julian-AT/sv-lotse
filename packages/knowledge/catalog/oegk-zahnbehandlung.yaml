id: oegk-zahnbehandlung
name_de: Konservierende-chirurgische Zahnbehandlung
name_simple: Kosten für Zahnbehandlung klären
area: C
life_situations:
  - illness
scope: social_insurance
carriers:
  - oegk
criteria:
  - id: private-reimbursement
    text_de:
      Bei Wahlzahnbehandlung sind Vertragsleistungen zunächst selbst zu bezahlen; Erstattung 80
      Prozent des entsprechenden Vertragstarifs.
    source:
      url: https://www.oegk.at/cdscontent/load?contentid=10008.748630&version=1786021238#page=39
      quote: Werden Leistungen von einer Wahlzahnärztin bzw. einem Wahlzahnarzt im In- oder Ausland
        erbracht, die zu den Vertragsleistungen zählen, müssen Sie die Rechnung zunächst selbst
        bezahlen und danach einreichen. Sie erhalten von der ÖGK eine Kostenerstattung in der Höhe
        von 80 Prozent der entsprechenden Vertragstarife.
      retrieved_at: 2026-11-06T00:07:42.653242Z
