id: sozialhilfe-steiermark
name_de: Sozialunterstützung in der Steiermark
name_simple: Geld für Leben und Wohnen in der Steiermark
area: E
life_situations:
  - low-income
  - unemployment
scope: state
carriers: []
criteria:
  - id: residence-styria
    text_de: Hauptwohnsitz und tatsächlicher Aufenthalt müssen in der Steiermark sein.
    condition: federal_state == 'Steiermark' and main_residence_confirmed == true and actual_residence_confirmed == true
    legal_basis: Steiermärkisches Sozialunterstützungsgesetz (StSUG), laut Land Steiermark
    source: &residence
      url: https://www.soziales.steiermark.at/cms/beitrag/12706097/61183307/
      quote: >-
        Grundsätzlich können nur jene Personen Sozialunterstützung nach dem
        StSUG (Steiermärkisches Sozialunterstützungsgesetz) erhalten, die ihren
        Hauptwohnsitz und ihren tatsächlichen Aufenthalt in der Steiermark haben sowie
      retrieved_at: 2026-11-05T23:49:35Z
  - id: residence-entitlement
    text_de: >-
      Dauernde Aufenthaltsberechtigung und grundsätzlich mindestens fünf Jahre
      Aufenthalt in Österreich. Unionsrechtliche und völkerrechtliche Ausnahmen,
      etwa für Asylberechtigte, prüft die Behörde. Kein automatischer Ausschluss
      allein wegen einer kürzeren Aufenthaltsdauer.
    legal_basis: Steiermärkisches Sozialunterstützungsgesetz (StSUG), laut Land Steiermark
    source: &status
      url: https://www.soziales.steiermark.at/cms/beitrag/12706097/61183307/
      quote: >-
        zu einem dauernden Aufenthalt im Inland berechtigt sind und sich
        grundsätzlich seit mindestens fünf Jahren im Bundesgebiet aufhalten
        (unionsrechtliche und völkerrechtliche Bestimmungen sehen aber auch
        Ausnahmen zur 5-Jahres-Frist vor, z.B. für Asylberechtigte).
      retrieved_at: 2026-11-05T23:49:35Z
  - id: own-resources-and-prior-benefits
    text_de: >-
      Eigene Mittel und vorrangige gleichartige Leistungen sind einzusetzen.
      Vermögensfreibeträge und weitere Ausnahmen prüft die Behörde.
    legal_basis: Steiermärkisches Sozialunterstützungsgesetz (StSUG), laut Land Steiermark
    source: &resources
      url: https://www.soziales.steiermark.at/cms/beitrag/12706097/61183307/
      quote: >-
        Bevor Sozialunterstützung gewährt werden kann, müssen die Antragstellenden
        zunächst die eigenen Mittel (Einkommen und Vermögen) zur Bestreitung des
        Lebensunterhaltes einsetzen. Auch müssen gleichartige Leistungen,
        die Bund oder Land gewähren, zuerst in Anspruch genommen werden.
      retrieved_at: 2026-11-05T23:49:35Z
  - id: third-party-claims
    text_de: Bestehende Ansprüche gegen Dritte, etwa auf Unterhalt oder offene Gehaltszahlungen, sind zu verfolgen.
    legal_basis: Steiermärkisches Sozialunterstützungsgesetz (StSUG), laut Land Steiermark
    source: &claims
      url: https://www.soziales.steiermark.at/cms/beitrag/12706097/61183307/
      quote: >-
        Gibt es Ansprüche gegen Dritte (z.B.: Unterhalt, Schadenersatz, offene
        Gehaltszahlung etc.), so müssen diese verfolgt werden.
      retrieved_at: 2026-11-05T23:49:35Z
  - id: work-and-exemptions
    text_de: >-
      Einsatz der Arbeitskraft, soweit keine gesetzliche Ausnahme vorliegt.
      Die Behörde prüft Ausnahmen; der Lotse beurteilt keine Arbeitsfähigkeit.
    legal_basis: § 7 Abs. 2 StSUG, laut Land Steiermark
    source: &work
      url: https://www.soziales.steiermark.at/cms/beitrag/12706097/61183307/
      quote: >-
        Die Höhe der Leistung ist vom Einsatz der Arbeitskraft abhängig.
        Dies gilt für arbeitsfähige Personen und Personen, die nach § 7 Abs 2 StSUG
        nicht vom Einsatz der Arbeitskraft ausgenommen sind.
      retrieved_at: 2026-11-05T23:49:35Z
