documents:
  - id: identification-and-residence
    name_de: Lichtbildausweis, Personenstand und gegebenenfalls Aufenthaltsnachweis
    required: true
    obtain_from: Eigene Dokumente; fehlende Ausfertigungen bei Passbehörde, Standesamt oder Aufenthaltsbehörde anfordern.
    source: &identification
      url: https://www.graz.at/cms/beitrag/10269022/7761791/Sozialunterstuetzung.html
      quote: >-
        amtlichen Lichtbildausweis (Reisepass, Personalausweis, Führerschein,
        ID-Card) Geburtsurkunde Staatsbürgerschaftsnachweis Nachweis über
        rechtmäßigen Aufenthalt (Aufenthaltstitel oder -bescheinigung)
      retrieved_at: 2026-11-05T23:55:00Z
  - id: housing-evidence
    name_de: Nachweise zu Wohnung und Wohnkosten, soweit zutreffend
    required: false
    obtain_from: Eigene Unterlagen bzw. bei Vermieter, Hausverwaltung oder Grundbuch anfordern.
    source: &housing
      url: https://www.graz.at/cms/beitrag/10269022/7761791/Sozialunterstuetzung.html
      quote: Mietvertrag Grundbuchsauszug Betriebskostennachweis sonstige wohnungsbezogene Kosten
      retrieved_at: 2026-11-05T23:55:00Z
  - id: income-evidence
    name_de: Nachweise zu Einkommen und bezogenen Leistungen, soweit zutreffend
    required: false
    obtain_from: Bei Arbeitgeber, Finanzamt, AMS, pensionsauszahlendem Träger oder Krankenkasse anfordern.
    source: &income-documents
      url: https://www.graz.at/cms/beitrag/10269022/7761791/Sozialunterstuetzung.html
      quote: >-
        Lohnbestätigung Einkommensteuerbescheid Leistungsbezugsbestätigung des
        Arbeitsmarktservice, Nachweise über Pensions-/Rentenleistungen
        Bestätigung der Krankenkasse über Krankengeld und Kinderbetreuungsgeld
      retrieved_at: 2026-11-05T23:55:00Z
  - id: asset-evidence
    name_de: Vermögensverzeichnis und vorhandene Vermögensbelege
    required: true
    obtain_from: Eigenes Vermögensverzeichnis erstellen; Belege bei Bank oder Bausparkasse anfordern.
    source: &assets
      url: https://www.graz.at/cms/beitrag/10269022/7761791/Sozialunterstuetzung.html
      quote: Vermögensverzeichnis Sparbücher Bausparverträge Kontoauszüge Aktien / Wertpapiere
      retrieved_at: 2026-11-05T23:55:00Z
  - id: employment-or-exemption-evidence
    name_de: AMS-Vormerkung oder vorhandener Nachweis einer Ausnahme
    required: false
    obtain_from: Vormerkbestätigung beim AMS anfordern; vorhandene amtliche Nachweise für Ausnahmen beilegen.
    source: &work-documents
      url: https://www.graz.at/cms/beitrag/10269022/7761791/Sozialunterstuetzung.html
      quote: Bestätigung der Vormerkung zur Arbeitssuche Gutachten zur Arbeitsunfähigkeit Nachweise über Verhinderung des Einsatzes der Arbeitskraft
      retrieved_at: 2026-11-05T23:55:00Z
  - id: representation-evidence
    name_de: Vollmacht oder Vertretungsnachweis, falls eine Vertretung handelt
    required: false
    obtain_from: Vollmacht durch die vertretene Person; vorhandenen gerichtlichen Vertretungsnachweis verwenden.
    source: &representation
      url: https://www.graz.at/cms/beitrag/10269022/7761791/Sozialunterstuetzung.html
      quote: Vertretungsnachweis (Erwachsenenschutzvertreter / Vollmacht)
      retrieved_at: 2026-11-05T23:55:00Z
