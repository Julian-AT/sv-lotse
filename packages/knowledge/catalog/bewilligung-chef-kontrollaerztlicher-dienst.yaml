  - id: wahlarzt-prescription
    name_de: Original-Rezept der Wahlärztin oder des Wahlarztes, wenn Sie es selbst zur Bewilligung einreichen
    required: false
    obtain_from: Wahlärztin oder Wahlarzt; per Post an die ÖGK oder persönlich in einer Kundenservicestelle
    source: *medicine-wahlarzt
  - id: written-approval
    name_de: Bewilligung der ÖGK, sobald sie vorliegt
    required: false
