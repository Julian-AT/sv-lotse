    office: ref:offices/oegk-burgenland
  - when: responsible_carrier == "oegk" and region == "Kärnten"
    office: ref:offices/oegk-kaernten
  - when: responsible_carrier == "oegk" and region == "Niederösterreich"
    office: ref:offices/oegk-niederoesterreich
  - when: responsible_carrier == "oegk" and region == "Oberösterreich"
    office: ref:offices/oegk-oberoesterreich
  - when: responsible_carrier == "oegk" and region == "Salzburg"
    office: ref:offices/oegk-salzburg
  - when: responsible_carrier == "oegk" and region == "Steiermark"
    office: ref:offices/oegk-steiermark
  - when: responsible_carrier == "oegk" and region == "Tirol"
    office: ref:offices/oegk-tirol
  - when: responsible_carrier == "oegk" and region == "Vorarlberg"
    office: ref:offices/oegk-vorarlberg
  - when: responsible_carrier == "oegk" and region == "Wien"
    office: ref:offices/oegk-kundenservice-wien-kinderbetreuungsgeld
  - when: responsible_carrier == "svs"
    office: ref:offices/svs-hauptstelle
  - when: responsible_carrier == "bvaeb"
    office: ref:offices/bvaeb-hauptstelle
documents:
  - id: birth-certificate
    name_de: Geburtsurkunde des Kindes
    required: false
    obtain_from: Standesamt; Bedarf mit der Krankenkasse klären, insbesondere bei Geburt im Ausland.
    source:
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.879630&portal=oegkportal
      quote: Geburtsurkunde des Kindes
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: initial-examination-proofs
    name_de: Nachweise der fünf Schwangerschaftsuntersuchungen und der ersten Kindesuntersuchung
    required: false
    obtain_from:
      Ärztin oder Arzt; bei Papiernachweisen Kopien der Bestätigungen. Bereits erfolgreich
      elektronisch übermittelte Nachweise mit der Krankenkasse abgleichen.
    source:
      url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/finanzielle-unterstuetzungen/3/2/Seite.080625
      quote: Bei der Antragstellung müssen die fünf Schwangerschaftsuntersuchungen und die erste
        Untersuchung des Kindes (in Kopie) nachgewiesen werden.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: later-examination-proofs
    name_de: Nachweise der Kindesuntersuchungen 2 bis 5
    required: false
    obtain_from:
      Ärztin oder Arzt; Papiernachweise als Kopie grundsätzlich bis zur Vollendung des 15.
      Lebensmonats an die Krankenkasse.
    source:
      url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/finanzielle-unterstuetzungen/3/2/Seite.080625
      quote:
        Die restlichen Untersuchungen müssen bis zum 15. Lebensmonat des Kindes (ebenfalls in Kopie)
        nachgewiesen werden.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: custody-proof
    name_de: Obsorgenachweis bei getrennt lebenden Eltern
    required: false
    obtain_from: Gericht oder vorhandene Obsorgevereinbarung; zuständige Krankenkasse klärt den
      erforderlichen Nachweis.
    source:
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.879630&portal=oegkportal
      quote:
        Obsorgeberechtigung für das Kind und Bezug der Familienbeihilfe durch den antragstellenden
        Elternteil
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: residence-status
    name_de: Aufenthaltsnachweise von Elternteil und Kind, falls erforderlich
    required: false
    obtain_from: Zuständige Aufenthalts- oder Asylbehörde; je nach Aufenthaltsstatus
      Anmeldebescheinigung, Aufenthaltstitel oder Bescheid.
    source:
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.879630&portal=oegkportal
      quote:
        Für Nicht-Österreicherinnen und Nicht-Österreicher zusätzlich ein rechtmäßiger Aufenthalt in
        Österreich (NAG-Karte) bzw. die Erfüllung bestimmter asylrechtlicher Voraussetzungen.
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: foreign-benefits
    name_de: Nachweise ausländischer Familienleistungen, falls vorhanden
    required: false
    obtain_from: Zuständige ausländische Leistungsstelle.
    source:
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.879630&portal=oegkportal
      quote: Nachweis über den Bezug der ausländischen Familienbeihilfe
      retrieved_at: 2026-11-05T23:52:44.349Z
  - id: maternity-payment
    name_de: Wochengeldbestätigung, falls von einer anderen Stelle bezogen
    required: false
    obtain_from: Zahlender Krankenversicherungsträger oder ausländische beziehungsweise private Leistungsstelle.
    source:
      url: https://www.sozialversicherung.gv.at/cdscontent/?contentid=10007.879630&portal=oegkportal
      quote: Wochengeldbestätigung bzw. Bestätigung über den Erhalt wochengeldähnlicher Leistungen
      retrieved_at: 2026-11-05T23:52:44.349Z
forms:
  - search: Bundeseinheitlicher Antrag auf Kinderbetreuungsgeld
    publisher: Österreichische Sozialversicherung
