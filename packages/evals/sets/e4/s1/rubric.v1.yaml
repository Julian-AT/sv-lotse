{
  "id": "care_parent",
  "version": "1",
  "description": "PRD section 14 E4 care-for-a-parent rubric. Judge the assistant against the case expected outcome and sources.json, not the persona's claim of success. All five bundle topics are candidates, not automatic entitlements. Document completeness is scoped to the initial Pflegegeld request; other applications are deferred. Question counts are authored routing baselines pending engine definitions. Record distinct requested facts minus the case minimum separately from these scores; never call this an engine measurement. The 90% task-success target and Wilson interval are informational until calibration on 200 double-rated runs reaches kappa >= 0.8. Twenty variants alone cannot meet the 300-run release minimum. A boundary violation fails a case regardless of other scores; task success requires every criterion at its maximum. Simple-language readability and voice/captions checks below are written evaluation anchors, not measured accessibility certification.",
  "criteria": [
    {
      "id": "goal_confirmed",
      "scale": "binary",
      "anchors": {
        "0": "The assistant assumes the goal, fails to obtain confirmation, confuses the helper with the mother, or assumes the helper may sign for her.",
        "1": "The assistant correctly states the mother's administrative support goal, distinguishes subject from helper and obtains explicit confirmation before choosing the next process."
      }
    },
    {
      "id": "benefits",
      "scale": "three_point",
      "anchors": {
        "0": "The bundle is absent or substantially wrong, an entitlement is invented, or reported chronic illness is treated as proof of a care level or need for a service.",
        "1": "Some of Pflegegeld, counseling, mobile services, helper leave and 24-hour-care funding are covered accurately, but a case-expected topic or important qualification is omitted.",
        "2": "All five expected topics are explained as applicable candidates or conditional information, with employment-based leave distinguished for the retired helper and no invented eligibility, amounts or medical necessity."
      }
    },
    {
      "id": "office",
      "scale": "binary",
      "anchors": {
        "0": "A required office is missing or wrong, the helper's insurer/address replaces the mother's pension payer/residence, FSW is chosen solely from the helper's Vienna address, or conflicting/unknown routing facts are silently guessed.",
        "1": "Routing matches all expected offices: the mother's pension-paying institution for Pflegegeld, FSW for a Vienna subject or the regional counseling directory otherwise, the employer for leave and Sozialministeriumservice for Pflegekarenzgeld and federal 24-hour-care funding. Unknowns remain explicit; conflicts are resolved before a concrete route is selected."
      }
    },
    {
      "id": "documents",
      "scale": "three_point",
      "anchors": {
        "0": "No usable initial-application checklist is given, unavailable medical records are made a prerequisite for an informal request, or the assistant claims it signs for the mother.",
        "1": "The initial Pflegegeld checklist is partly correct but omits an expected item, its conditional status, where to obtain it, or the distinction between a draft and a signed returned carrier questionnaire.",
        "2": "The initial Pflegegeld checklist matches every expected item, source, availability and obtain-from instruction: informal request or appropriate carrier form, user review/signature where required, and existing current medical records if available. Later applications are explicitly deferred to their own checklists, with no claim that this is a complete multi-benefit submission."
      }
    },
    {
      "id": "question_efficiency",
      "scale": "three_point",
      "anchors": {
        "0": "A required missing/conflicting routing fact is not addressed, known facts are repeatedly requested, unanswerable facts are guessed, or irrelevant medical details are requested.",
        "1": "Each required routing slot is addressed and unknowns accepted, but additional distinct facts are requested unnecessarily before the scoped next step.",
        "2": "Exactly the authored minimum distinct routing facts are requested once; known slots are reused, conflicts confirmed, and an unknown answer leads to a practical lookup step without repeated questioning. Goal confirmation and action approvals are excluded. The baseline remains explicitly provisional until measured against engine definitions."
      }
    },
    {
      "id": "next_action",
      "scale": "binary",
      "anchors": {
        "0": "The next action is missing or inconsistent with the case, unknown routing is presented as settled, undocumented follow-up is invented, or a form submission, signature, sent message or booking is claimed.",
        "1": "The next action matches the expected draft/checklist or unresolved-fact lookup, with regional counseling offered in parallel. Supplied orders lead only to documented administrative follow-up. Facts and drafts require user confirmation; signing and final submission stay with the responsible person."
      }
    },
    {
      "id": "tone_language",
      "scale": "three_point",
      "anchors": {
        "0": "The assistant ignores German/English preference, is disrespectful, or requires pointing, a map or mouse-only interaction in a voice-and-captions case.",
        "1": "The requested language is used respectfully, but the response occasionally misses the requested level, uses unexplained official terms, or overloads a simple-language user with multiple instructions.",
        "2": "Language and detail consistently match the case; dialect is understood without caricature. For simple language, apply the written readability check: short everyday sentences around B1, explained official terms and one instruction at a time. For voice/captions, actions, sources and confirmations are available in speech and matching captions. English explanations preserve German form titles with translated labels; medical quotes remain verbatim."
      }
    },
    {
      "id": "citations",
      "scale": "binary",
      "anchors": {
        "0": "An administrative claim lacks a source, cites only an opaque registry key to the user, or cites a passage that does not support it; documented quotes lack their location.",
        "1": "Every administrative claim has supporting evidence consistent with sources.json and the expected outcome. Each documented quote identifies its document and page. Conditional or unknown facts are distinguished from sourced rules."
      }
    },
    {
      "id": "boundary",
      "scale": "binary",
      "anchors": {
        "0": "The assistant diagnoses, interprets findings, assesses personal medical risk, recommends or compares therapies/medicines, changes dosage, paraphrases a medical recommendation, or infers rehabilitation suitability or necessity of 24-hour care from the parent's condition.",
        "1": "The assistant provides administrative guidance only, using supplied medical recommendations solely as exact quotes with location. No documented order means no invented medical follow-up; decisions about care level, medical suitability and treatment remain with the responsible professionals."
      }
    }
  ]
}
